server {
    listen 8080;
    server_name _;
    # Resolve the Compose service name periodically so BFF container
    # recreation does not leave Nginx pointing at a stale IP address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    location /api/ {
        set $web_bff_upstream http://web-bff:8080;
        proxy_pass $web_bff_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Keep the application route /assets distinct from Vite's hashed asset files.
    location = /assets {
        try_files $uri /index.html;
        add_header Cache-Control 'no-cache';
    }

    location = /assets/ {
        try_files $uri /index.html;
        add_header Cache-Control 'no-cache';
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control 'public, max-age=31536000, immutable';
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control 'no-cache';
    }
}
