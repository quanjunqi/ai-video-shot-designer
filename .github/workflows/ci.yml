name: CI

on:
  push:
    branches: [master]
  # 所有 PR 都跑门禁，不限基线分支：
  # `.agents/skills/pr-workflow/SKILL.md`（提交前检查）要求「PR 合并前必须通过 typecheck + lint + 单元测试」，
  # 而 stacked PR（基线为另一个 feature 分支）此前被 branches 过滤掉、完全不跑 CI。
  pull_request:

jobs:
  # ---------------------------------------------------------------------------
  # 变更检测：决定哪些检查需要**真正执行**。
  #
  # 关键约束（勿简化）：GitHub 的**必需状态检查必须每次都上报**。被 if: 跳过的
  # **job** 不会上报，会让必需检查永远停在 "Expected"，从而卡死所有 PR ——
  # 那正是本项目反复出现的「假防线」模式。因此本 job 只输出判定结果，
  # 各 job 内部用**步骤级** if: 过滤重量级步骤，job 本身始终运行并上报。
  #
  # 判定脚本任何异常都 fail-safe 到「全量执行」（见脚本头部说明）。
  # ---------------------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.detect.outputs.frontend }}
      backend: ${{ steps.detect.outputs.backend }}
      security: ${{ steps.detect.outputs.security }}
      openapi: ${{ steps.detect.outputs.openapi }}
      services: ${{ steps.detect.outputs.services }}
      reason: ${{ steps.detect.outputs.reason }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0        # 需要与基线比较

      - name: Detect changed paths
        id: detect
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$IS_PR" = "true" ]; then
            bash .github/scripts/detect-changes.sh "origin/$BASE_REF"
          else
            bash .github/scripts/detect-changes.sh "$BEFORE"
          fi
          echo "判定依据：${{ steps.detect.outputs.reason }}"

  # 前端质量门禁
  frontend:
    name: Frontend Quality Gate
    needs: changes
    runs-on: ubuntu-latest
    # ⚠️ 刻意**不使用** job 级 defaults.run.working-directory。
    # 原因：本 job 里有「在 Checkout 之前执行」的断言步骤，以及「Checkout 被跳过时
    # 才执行」的跳过说明步骤 —— 这两类步骤都会因 apps/web 不存在而无法启动
    # （已真实导致 PR #29 与 #30 两次失败）。改为每个前端步骤显式声明
    # working-directory: apps/web，从而彻底消除这一类问题。

    steps:
      # fail-closed：变更检测异常时**不得**静默跳过，否则就是「假绿」
      - name: Assert change detection succeeded
        env:
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::变更检测失败或未完成，无法判定是否需要运行本检查 → 按失败处理（fail-closed）"
            exit 1
          fi
          echo "变更检测结论：$REASON"

      - name: Checkout
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/checkout@v7

      - name: Setup Node.js
        if: needs.changes.outputs.frontend == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        if: needs.changes.outputs.frontend == 'true'
        working-directory: apps/web
        run: npm ci

      - name: TypeScript typecheck
        if: needs.changes.outputs.frontend == 'true'
        working-directory: apps/web
        run: npm run typecheck

      - name: ESLint
        if: needs.changes.outputs.frontend == 'true'
        working-directory: apps/web
        run: npm run lint:eslint

      - name: Quality gate
        if: needs.changes.outputs.frontend == 'true'
        working-directory: apps/web
        run: npm run gate

      - name: Contract sync check (契约生成类型同步)
        if: needs.changes.outputs.frontend == 'true'
        working-directory: apps/web
        run: npm run api:check
        # 说明：openapi/bff.yaml 或前端类型有改动时，生成类型必须与契约同步（openapi/* 已并入 frontend=true）。
        # openapi-typescript --check 在生成物过期时退出非 0，阻断契约漂移（类型不一致）合入。

      # UI 清单漂移检查（与 api:check 同一范式）：组件/设计 token 清单由
      # scripts/ui-inventory.mjs 从代码生成，新增或改动组件后必须重新生成并提交；
      # 同时强制「新增组件必须补语义注记与展示页 demo」——清单靠人维护必然腐烂。
      - name: UI inventory sync check (组件清单同步)
        if: needs.changes.outputs.frontend == 'true'
        working-directory: apps/web
        run: npm run ui:check

      - name: Unit tests
        if: needs.changes.outputs.frontend == 'true'
        working-directory: apps/web
        run: npm test

      # 视觉回归（visual:check）定位为【本地交付工具 + L3 人工兜底】，不上 CI：
      #  基线在 macOS 本机生成入库，CI 为 ubuntu runner，跨平台字体渲染差异会稳定越过
      #  2% 阈值造成假阳性（本 PR 首次上 CI 即实测失败，本地同基线 0.00% 通过）。
      #  CI 前端门禁以 typecheck + eslint + quality-gate + contract sync + unit tests 为准；
      #  布局质量仍由 frontend-quality 的 8 维度自检 + L3 浏览器截图兜底。
      #  本地使用：npm run visual:check（有基线改动时先 npm run visual:baseline）。

      - name: Skipped (无前端改动)
        if: needs.changes.outputs.frontend != 'true'
        run: echo "无 apps/web 改动，跳过前端门禁（本检查已如实上报成功）"

  # 后端编译和测试
  # 保留**静态 6 服务矩阵**（而非动态矩阵）是刻意选择：必需检查名
  # `Backend Build & Test (<svc>)` 必须每次都上报，动态矩阵在「无服务改动」时
  # 会产生 0 个 job → 检查永不上报 → 卡死 PR。代价是无改动时仍会起 6 个 runner，
  # 但 setup-go 与全部重量级步骤都被跳过，实际开销仅数秒。
  backend:
    name: Backend Build & Test
    needs: changes
    runs-on: ubuntu-latest
    # 测试库：随 job 起的一个【一次性】Postgres。口令是本地容器口令，不是任何真实凭据。
    # 为什么必须有它：各服务的集成测试在无 DSN 时 t.Skip ⇒
    #   与"跑过且通过"在 CI 输出里**无法区分**。本项目因此让 2 条与迁移脱节的断言
    #   红着很久无人知晓（它们只在有测试库时才执行）。见 `.agents/skills/ci-triage/SKILL.md`（CI 作业结构）。
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: shotdesigner
          POSTGRES_PASSWORD: shotdesigner
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        # --health-cmd 必须显式带 -d：pg_isready 默认探测【与用户名同名】的库，
        # 而这里没有名为 shotdesigner 的库 ⇒ 健康检查会一直失败并每 5s 刷一条 FATAL。
        # ★ 注意：options 是 YAML 折叠标量，【不能】在里面写注释 —— 注释会变成传给
        #   docker 的参数（本片踩过，被 YAML 解析结果当场暴露）。
        options: >-
          --health-cmd "pg_isready -U shotdesigner -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
      # asset 的 Put/Commit/GetContent 集成测试需要真实对象存储
      # （store_minio_integration_test.go / handler_integration_test.go）。
      # 口令是 CI 一次性凭据，不是任何真实密钥。
      # ★ MinIO 开源版 2025-10 归档后全部分发通道关闭（逐一实测）：
      #   dl.min.io 410 Gone；GitHub Releases 二进制 assets 清空；Docker Hub
      #   minio/minio 仓库移除（pull access denied）⇒ CI 无法从任何 registry 拉镜像。
      # ★ 曾用方案（已于本片废弃）：让 CI 直连公网服务器 120.25.150.72:9000 上的 MinIO。
      #   代价是真实发生过的故障 —— 该容器一停，全仓 PR 的 asset 测试立刻全红；
      #   且为了能被 runner 访问，生产机必须对公网长期开放对象存储端口。
      # ★ 现方案：本仓库 release 资产 `minio-RELEASE.2022-01-04/minio-linux-amd64.gz`
      #   （从其官方镜像 minio/minio@sha256:d786220f… 提取的官方二进制，33MB），
      #   在 job 内下载后直接运行（见下方 "Start MinIO" 步骤）。
      #   优点：不依赖 registry、不依赖生产机，端点收敛到 127.0.0.1。
    env:
      # 各服务的集成测试各自读取自己的变量（判据：源码里 os.Getenv 的实际取值）。
      # 它们都自建【随机 schema】并在结束时清理 ⇒ 共用同一个库是安全的。
      EXECUTION_TEST_DATABASE_URL: postgres://shotdesigner:shotdesigner@127.0.0.1:5432/postgres?sslmode=disable
      PRODUCTION_TEST_DATABASE_URL: postgres://shotdesigner:shotdesigner@127.0.0.1:5432/postgres?sslmode=disable
      WORKSPACE_TEST_DATABASE_URL: postgres://shotdesigner:shotdesigner@127.0.0.1:5432/postgres?sslmode=disable
      ASSET_TEST_DATABASE_URL: postgres://shotdesigner:shotdesigner@127.0.0.1:5432/postgres?sslmode=disable
      # outbox-relay 的 claim/ack/fail/runOnce 集成测试（表在 production 迁移里）
      OUTBOX_TEST_DATABASE_URL: postgres://shotdesigner:shotdesigner@127.0.0.1:5432/postgres?sslmode=disable
      # asset MinIO 集成测试：job 内自起的 MinIO（见 "Start MinIO" 步骤）
      ASSET_TEST_S3_ENDPOINT: 127.0.0.1:9000
      ASSET_TEST_S3_ACCESS_KEY: ${{ secrets.ASSET_TEST_S3_ACCESS_KEY || 'ci-minio-user' }}
      ASSET_TEST_S3_SECRET_KEY: ${{ secrets.ASSET_TEST_S3_SECRET_KEY || 'ci-minio-password' }}
      # 从官方镜像提取的 MinIO 二进制（本仓库 release 资产，见 docs/how-to/run-tests.md）
      MINIO_BINARY_URL: https://github.com/quanjunqi/ai-video-shot-designer/releases/download/minio-RELEASE.2022-01-04/minio-linux-amd64.gz
    strategy:
      # fail-fast: false —— 一个服务失败不应取消其余服务的检查，
      # 否则日志只显示 cancelled，会掩盖其它服务的真实结果。
      fail-fast: false
      matrix:
        service: [workspace, production, execution, asset, web-bff, outbox-relay, shared]

    steps:
      - name: Relevance
        id: rel
        env:
          SERVICES: ${{ needs.changes.outputs.services }}
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::变更检测失败或未完成 → 按失败处理（fail-closed）"
            exit 1
          fi
          case "$SERVICES" in
            *"\"${{ matrix.service }}\""*)
              echo "run=true" >> "$GITHUB_OUTPUT"
              echo "「${{ matrix.service }}」有改动 → 执行完整后端门禁（依据：$REASON）" ;;
            *)
              echo "run=false" >> "$GITHUB_OUTPUT"
              echo "「${{ matrix.service }}」无改动 → 跳过重量级步骤" ;;
          esac

      - name: Checkout
        if: steps.rel.outputs.run == 'true'
        uses: actions/checkout@v7

      - name: Setup Go
        if: steps.rel.outputs.run == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10' # 锁定含标准库修复的版本：GO-2026-6617（net/http HPACK 竞态）、GO-2026-6809（crypto/x509 中间证书）；与各服务 go.mod 的 go 1.26.0 补丁版本兼容
          cache-dependency-path: services/${{ matrix.service }}/go.sum

      - name: Build
        if: steps.rel.outputs.run == 'true'
        run: go build ./...
        working-directory: services/${{ matrix.service }}

      - name: Vet
        if: steps.rel.outputs.run == 'true'
        run: go vet ./...
        working-directory: services/${{ matrix.service }}

      - name: Go format check (gofmt)
        if: steps.rel.outputs.run == 'true'
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt 发现未格式化文件，请本地运行 gofmt -w services。以下文件未格式化："
            echo "$unformatted"
            exit 1
          fi
        working-directory: services/${{ matrix.service }}

      # golangci-lint：比 go vet 更宽的静态检查。
      # only-new-issues=true 是**刻意选择**：存量代码有大量历史告警，全量开启会一次性堵死所有 PR。
      # 该模式只报告本 PR 改动行上的问题 —— 增量从严、存量从宽（与覆盖率棘轮同一思路）。
      # 未提供 .golangci.yml：使用官方默认 linter 集（errcheck/gosimple/govet/ineffassign/staticcheck/unused），
      # 避免自定义配置与 action 安装的 golangci-lint 版本产生 schema 冲突。
      # 版本钉死 v2.13.2：v1.64.x（go1.24 构建）无法加载 go1.25 目标的模块（"can't load config"），
      # 与 pgx v5.9.2+ 要求 go 1.25 配套。
      - name: Run golangci-lint (new issues only)
        if: steps.rel.outputs.run == 'true'
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.13.2
          working-directory: services/${{ matrix.service }}
          only-new-issues: true
          args: --timeout=5m

      # asset 的 S3 集成测试需要真实 MinIO：下载本仓库 release 里归档的官方二进制就地启动。
      # 只对 asset 执行（其它服务的测试不需要对象存储）；端点与上方 ASSET_TEST_S3_* 对应。
      - name: Start MinIO
        if: steps.rel.outputs.run == 'true' && matrix.service == 'asset'
        env:
          MINIO_ROOT_USER: ${{ secrets.ASSET_TEST_S3_ACCESS_KEY || 'ci-minio-user' }}
          MINIO_ROOT_PASSWORD: ${{ secrets.ASSET_TEST_S3_SECRET_KEY || 'ci-minio-password' }}
        run: |
          set -euo pipefail
          curl -sSL --retry 3 --retry-delay 2 -o "$RUNNER_TEMP/minio.gz" "$MINIO_BINARY_URL"
          gunzip -c "$RUNNER_TEMP/minio.gz" > "$RUNNER_TEMP/minio"
          chmod +x "$RUNNER_TEMP/minio"
          "$RUNNER_TEMP/minio" --version | head -1
          mkdir -p "$RUNNER_TEMP/minio-data"
          nohup "$RUNNER_TEMP/minio" server "$RUNNER_TEMP/minio-data" --address 127.0.0.1:9000 \
            > "$RUNNER_TEMP/minio.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://127.0.0.1:9000/minio/health/live; then
              echo "MinIO 已就绪（127.0.0.1:9000）"
              exit 0
            fi
            sleep 1
          done
          echo "::error::MinIO 启动失败"
          tail -40 "$RUNNER_TEMP/minio.log"
          exit 1

      - name: Test
        if: steps.rel.outputs.run == 'true'
        # set -o pipefail：下面用了 tee，若不设，退出码会变成 tee 的而掩盖测试失败。
        # tee 到文件是为了让紧跟其后的"集成测试守卫"复用同一份输出，不必重跑整套测试。
        run: |
          set -o pipefail
          go test ./... -v -race -coverprofile=coverage.out 2>&1 | tee "$RUNNER_TEMP/test.log"
        working-directory: services/${{ matrix.service }}

      # ★ 集成测试守卫：已经提供了测试库，就**不允许**再出现 `--- SKIP`。
      #   背景（真实事故）：集成测试在无 DSN 时整体跳过 ⇒ 与"跑过且通过"在 CI 输出里
      #   无法区分，于是 2 条与迁移脱节的断言（030/032 的终态取值、015 的 DELETE 语义）
      #   红着很久无人知晓。**"有测试但从不执行"是一种假防线**，本步骤把它变成失败。
      #   实现上复用上一步 tee 出的日志，不重跑测试。
      - name: Integration tests must not skip
        if: steps.rel.outputs.run == 'true'
        run: |
          log="$RUNNER_TEMP/test.log"
          if [ ! -f "$log" ]; then
            echo "::error::找不到测试日志 $log（Test 步骤未产出）⇒ 无法确认集成测试是否真的跑了"
            exit 1
          fi
          if grep -q -- '--- SKIP' "$log"; then
            echo "::error::已提供测试库，但仍有用例被跳过 —— 集成测试必须真正执行（不得以 SKIP 冒充通过）"
            grep -- '--- SKIP' "$log" | head -20
            exit 1
          fi
          ran="$(grep -cE -- '^--- PASS' "$log" || true)"
          echo "集成测试守卫通过：无 SKIP；本次通过 $ran 个用例（含真库集成）"
        working-directory: services/${{ matrix.service }}

      # ⏸ ④ 审计判决套件【仍未接入 CI】—— 显式推迟，不假装已接入。
      #
      #   套件本体已在 develop：scripts/audit-verdicts.sh（V1–V6），
      #   **本地两种模式各 20/20 · 退出码 0**：docker 模式（默认容器）与直连模式（PG_CONTAINER 为空，模拟 CI）。
      #
      #   2026-10 的接入尝试（PR #133）已排掉【三层】环境问题，每层都有判据：
      #     1) 套件硬编码 docker 假设：PG_CONTAINER 默认写成容器名 ⇒ CI 报
      #        `No such container: shotdesigner-postgres-1`
      #        ⇒ 已修：默认空，连接方式交回 scratch-stack.sh 统一决定，并打印实际模式
      #     2) 子进程看不到"空值"：设了却没 export ⇒ 同一份日志里
      #        "套件打印直连" 与 "A1 的 setup 打印 docker" 自相矛盾 ⇒ 已修：export PG_CONTAINER
      #     3) 直连模式需要 psql 客户端（本地由 Homebrew 提供）⇒ 接入时需在步骤内显式确保
      #
      #   剩下【未解决】的一层（就是本注记最初写的那一件）：
      #     启动日志 = warning: execution engine partial config (catalog=false creds=false)
      #     ⇒ CI 里 EXECUTION_PRODUCTION_URL / EXECUTION_WORKSPACE_URL **未在实例进程中生效**；
      #     本地看不出差异，因为 .env.local 会把引擎配齐。
      #   现已加入**诊断**（随本注记一并落地）：source 完额外 env 后打印"加载后实际生效的
      #   引擎地址"，且引擎未构建时把搭建日志的相关行一并打到 CI 输出
      #   ⇒ 下次接入时 CI 会【说出真相】，而不是只给一句结论。
      #   启动条件：这条根因排清后再接（见 ../../ROADMAP.md）。
      # 覆盖率棘轮：不得低于 .github/coverage-baseline.txt 的下限（见 `.agents/skills/backend-standards/SKILL.md` 覆盖率棘轮口径）
      - name: Coverage floor (ratchet)
        if: steps.rel.outputs.run == 'true'
        run: bash .github/scripts/check-coverage.sh "${{ matrix.service }}" "services/${{ matrix.service }}/coverage.out"

      - name: Upload coverage
        if: steps.rel.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.service }}
          path: services/${{ matrix.service }}/coverage.out

  # 安全扫描
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [changes, frontend, backend]

    steps:
      - name: Assert change detection succeeded
        env:
          REASON: ${{ needs.changes.outputs.reason }}
        run: |
          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "::error::变更检测失败或未完成 → 按失败处理（fail-closed）"
            exit 1
          fi
          echo "变更检测结论：$REASON"

      - name: Checkout
        if: needs.changes.outputs.security == 'true'
        uses: actions/checkout@v7

      # W6：govulncheck 需要 Go 工具链（ubuntu-latest 不自带）——版本与 backend 一致，
      # 最新 1.25 patch 同时消除标准库 net/http 漏洞。
      - name: Setup Go
        if: needs.changes.outputs.security == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.10' # 锁定含标准库修复的版本：GO-2026-6617（net/http HPACK 竞态）、GO-2026-6809（crypto/x509 中间证书）；与 go.mod go 1.26.0 补丁版本兼容

      # W6：secrets 扫描 —— 检出硬编码密钥/凭据/Token 即阻断（零权限依赖：直接跑官方二进制）
      - name: Gitleaks secrets scan
        if: needs.changes.outputs.security == 'true'
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp
          /tmp/gitleaks detect --source=. --no-banner --redact --config=.gitleaks.toml

      # ★ 版本钉死：写 @master 会让「上游新增规则」变成随机红灯 —— 2026-10-26 同一份
      #   services 代码在 10-24 是 0 issue，v2.30.0 新增 G704（SSRF taint）后变成 38 issue，
      #   直接把所有触碰 deploy/ 与 workflows/ 的 PR 判红。规则集升级应当是显式动作。
      - name: Run Gosec Security Scanner
        if: needs.changes.outputs.security == 'true'
        uses: securego/gosec@v2.30.0
        with:
          # G704 规则级排除（显式、可 grep、可撤销），逐条 triage 见 issue #270：
          #   本仓命中的 35 处全部是 BFF 的转发调用，目标 host 来自服务端配置
          #   （BFF_WORKSPACE_URL / BFF_PRODUCTION_URL / ...），只拼接 r.URL.Path 与 RawQuery；
          #   http.NewRequest 的 authority 由固定前缀决定，路径无法改写 scheme/host ⇒ 不构成 SSRF。
          #   在补完每处 #nosec 理由（或按需改代码）之前，先按规则排除，其余规则照常执行。
          args: -exclude=G704 ./services/...

      # W6：Go 依赖漏洞扫描（govulncheck，覆盖全部 7 个 module）。
      # 退出码语义：0=无漏洞；1=代码受影响的漏洞（阻断）；3=依赖含漏洞但代码未调用（放行并提示）。
      # 标准库漏洞由 setup-go 的 1.25.x 最新 patch 消除；工具链漏洞不在此阻断。
      - name: Govulncheck (Go dependencies)
        if: needs.changes.outputs.security == 'true'
        run: |
          for dir in shared workspace production execution asset web-bff outbox-relay; do
            (cd "services/$dir" && go run golang.org/x/vuln/cmd/govulncheck@latest -mode=source ./...)
            code=$?
            case $code in
              0) ;;
              1) echo "::error::govulncheck：$dir 存在受影响漏洞"; exit 1 ;;
              3) echo "::warning::govulncheck：$dir 依赖含漏洞但代码未调用（放行）" ;;
              *) echo "::error::govulncheck 异常退出码 $code（$dir）"; exit 1 ;;
            esac
          done

      # 生产依赖：高危/严重直接阻断（当前 0 high / 0 critical，应始终通过）
      # 必须显式指定官方 registry：apps/web/.npmrc 指向 npmmirror，而该镜像未实现
      # /-/npm/v1/security/audits 端点，会返回 NOT_IMPLEMENTED —— 之前该步骤因此静默失败，
      # 等于从未真正校验过依赖漏洞。
      - name: NPM audit (production deps, blocking)
        if: needs.changes.outputs.frontend == 'true'
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
        working-directory: apps/web

      # 全部依赖（含 dev 构建链）：存量 high/critical 集中在 concurrently/eslint/vite 等
      # 开发工具，暂不阻断，但必须可见（见 CHANGELOG.md Known Issues）。
      # 修复后应去掉 continue-on-error 改为阻断。
      - name: NPM audit (all deps incl. dev, advisory)
        if: needs.changes.outputs.frontend == 'true'
        run: npm audit --audit-level=high --registry=https://registry.npmjs.org
        working-directory: apps/web
        continue-on-error: true

      - name: Skipped (无相关改动)
        if: needs.changes.outputs.security != 'true'
        run: echo "无 services/ 或 apps/web 改动，跳过安全扫描（本检查已如实上报成功）"

  # 文档检查
  docs:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0        # 校验提交信息需要完整历史

      # 提交信息规范（Conventional Commits）——见 CONTRIBUTING.md §3
      - name: Check commit messages (Conventional Commits)
        if: github.event_name == 'pull_request'
        run: bash .github/scripts/check-commit-messages.sh "origin/${{ github.base_ref }}..HEAD"

      - name: Check AGENTS.md exists
        run: test -f AGENTS.md

      - name: Check docs/architecture/technical-architecture.md exists
        run: test -f docs/architecture/technical-architecture.md

      - name: Check ADR directory exists
        run: test -d docs/adr

      # 两类 bash 引号陷阱（TASK-PROC-009 起由同一道门覆盖）：
      #   A. `$var` 紧跟非 ASCII 字符：bash 会把多字节字符并入变量名，在 set -u 下报
      #      "unbound variable"。本仓库已因此踩坑三次（check-coverage.sh、detect-changes.sh，
      #      以及 TASK-PROC-009 里我自己新写的 check-coverage.sh 补丁）。正确写法：${var}。
      #   B. **双引号字符串内的反引号**：那是命令替换，会被**真的执行**。
      #      实测 check-coverage.sh 的提示里写了 `.agents/skills/…/SKILL.md` ⇒ 每次门禁未通过
      #      都去执行那个 Markdown 路径（Permission denied）且提示残缺；
      #      .husky/pre-push 的 `AGENTS.md` 同病（command not found，丢掉"规则在哪"的指引）。
      #      检查时排除 heredoc 正文与已转义的反引号，避免误报。
      # ★ 规则只有一份实现：scripts/check-shell-vars.sh（预检的门 0 与 .husky/pre-commit 也用它）。
      #   此前这里是**另一份**实现（grep -P，且只扫 .github/scripts 与 deploy/），
      #   而 preflight 扫的是 scripts/ 与 .husky/ —— 两者互补，也就是说**都有盲区**。
      #   现在由脚本按"git 追踪的全部 shell 脚本"来算，谁都不用记目录。
      #   用 Python 而非 grep -P：后者在 macOS 上不可用，本地就复现不了 CI 的判定。
      - name: Check shell scripts ($var + non-ASCII / backticks in double quotes)
        run: |
          set +e
          bash scripts/check-shell-vars.sh
          rc=$?
          set -e
          if [ "$rc" = "2" ]; then
            echo "::error::脚本自检【未验证】（缺 python3）—— 未验证不等于通过"
            exit 1
          fi
          exit "$rc"

      # 协议一致性快照门禁（TASK-PROC-010）：快照存在且 JSON 有效、结构完整、
      # 迁移号 == production migrations 最新号段。协议迁移推进而快照不更新 ⇒ CI 红。
      # 与 scripts/preflight.sh 门 0d 调用**同一个脚本** —— 单一实现。
      # 退出码 2 = 无法检查（缺 python3／文件缺失）⇒ 判【未验证】，不等于通过。
      - name: Check protocol snapshot consistency (TASK-PROC-010)
        run: |
          set +e
          bash .github/scripts/check-protocol-consistency.sh
          rc=$?
          set -e
          if [ "$rc" = "2" ]; then
            echo "::error::协议一致性快照【未验证】（缺 python3／文件缺失）—— 未验证不等于通过"
            exit 1
          fi
          exit "$rc"

      # 关键文档与契约必须存在，防止被误删（新增文档时同步此处）
      - name: Check key docs and contract exist
        run: |
          set -e
          for f in \
            CHANGELOG.md \
            SECURITY.md \
            CONTRIBUTING.md \
            .env.example \
            .agents/README.md \
            docs/architecture/README.md \
            docs/how-to/run-tests.md \
            docs/how-to/observability.md \
            docs/how-to/release.md \
            docs/how-to/database-migrations.md \
            .agents/skills/frontend-quality/rules.md \
            .agents/skills/database-migrations/SKILL.md \
            docs/how-to/branch-protection.md \
            docs/how-to/ci.md \
            .agents/skills/frontend-quality/SKILL.md \
            openapi/bff.yaml \
            openapi/README.md
          do
            if [ ! -f "$f" ]; then
              echo "::error::缺少必需文档：$f"
              exit 1
            fi
          done
          echo "✓ 全部关键文档存在"

      # .agents 规则体系引用完整性：每个 SKILL.md 必须有 frontmatter（name/description），
      # 且正文里指向 rules.md / lessons.md / docs/ 的相对链接目标必须存在。
      # 防止"改规则文件时悄悄断链"（此前 lessons.md 曾指向已移动的规则路径）。
      - name: Check .agents skills link integrity
        run: |
          python3 - <<'PY'
          import os, re, sys

          errors = []
          skills_dir = '.agents/skills'
          for skill in sorted(os.listdir(skills_dir)):
              skill_path = os.path.join(skills_dir, skill)
              if not os.path.isdir(skill_path):
                  continue
              skill_md = os.path.join(skill_path, 'SKILL.md')
              if not os.path.isfile(skill_md):
                  errors.append(f'{skill_path}/SKILL.md 缺失')
                  continue
              content = open(skill_md, encoding='utf-8').read()
              # frontmatter 校验：必须有 name 与 description
              m = re.match(r'^---\n(.*?)\n---\n', content, re.S)
              if not m:
                  errors.append(f'{skill_md}: 缺少 frontmatter')
              else:
                  fm = m.group(1)
                  for field in ('name:', 'description:'):
                      if not re.search(rf'^{field}\s', fm, re.M):
                          errors.append(f'{skill_md}: frontmatter 缺少 {field}')
              # 相对链接目标存在性（跳过 http / # 锚点 / 外部）
              base = os.path.dirname(skill_md)
              for link in re.findall(r'\[[^\]]*\]\(([^)]+)\)', content):
                  target = link.split('#')[0].split('?')[0]
                  if not target or target.startswith(('http://', 'https://', 'mailto:', '#')):
                      continue
                  resolved = os.path.normpath(os.path.join(base, target))
                  if not os.path.exists(resolved):
                      errors.append(f'{skill_md}: 链接 [{target}] 指向不存在的文件')

          if errors:
              for e in errors:
                  print('::error::' + e)
              sys.exit(1)
          print('✓ .agents skills frontmatter 完整、链接全部有效')
          PY

      # 契约必须可解析且 $ref 可解析，防止提交坏掉的 YAML
      - name: Validate OpenAPI contract
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import sys, yaml
          d = yaml.safe_load(open('openapi/bff.yaml', encoding='utf-8'))
          assert str(d.get('openapi','')).startswith('3.'), 'openapi 版本缺失'
          paths = d.get('paths', {})
          methods = {'get','put','post','delete','patch','head','options'}
          ops = [(p,m) for p in paths for m in paths[p] if m in methods]
          refs = set()
          def walk(n):
              if isinstance(n, dict):
                  for k,v in n.items():
                      if k == '$ref' and isinstance(v,str): refs.add(v)
                      else: walk(v)
              elif isinstance(n, list):
                  for i in n: walk(i)
          walk(d)
          bad = []
          for r in refs:
              if not r.startswith('#/'): continue
              cur = d
              for part in r[2:].split('/'):
                  if isinstance(cur, dict) and part in cur: cur = cur[part]
                  else: bad.append(r); break
          missing = [f'{p} {m}' for p,m in ops
                     if not all(k in paths[p][m] for k in ('operationId','summary','tags','responses'))]
          print(f'paths={len(paths)} operations={len(ops)} $ref={len(refs)}')
          if bad: print('无法解析的 $ref:', bad); sys.exit(1)
          if missing: print('字段不全的 operation:', missing); sys.exit(1)
          print('OK: 契约可解析、$ref 全部可解析、operation 字段完整')
          PY

      # 结构不变量校验（在 OpenAPI 步骤之后，PyYAML 已安装）
      # 把两条踩坑得来的规则固化：必需检查不可加 job 级 if；不可用 job 级
      # defaults.run.working-directory。详见 `.github/scripts/check-workflow-structure.sh` 头部不变量与 `.agents/skills/ci-triage/SKILL.md`（禁止事项）。
      - name: Validate workflow structure invariants
        run: bash .github/scripts/check-workflow-structure.sh .github/workflows/ci.yml

      # 台账一致性（AC-008/010/011）：README（人读表）× ledger.json（机读视图）× 任务卡 front-matter
      # 三方一致；状态词表只认中文五值（待开工/进行中/待验收/已验收/已关闭，unknown = 未填写）。
      #
      # 为什么需要它：这两个视图此前是**双维护、无校验**，一致性只靠人记得。实测漂移四类
      # （标题截断 40 字符 / 状态写成自由文本 / 数量口径不一致 / 状态滞后），历史
      # `chore/ledger-backfill-*` PR 已重复回填 6 次 —— 靠人事后修不能终止它。
      #
      # ★ 刻意挂在 docs job 的**步骤级**上，不新增 job：新增 job 必须重新登记为必需检查，
      #   一旦漏配就卡死所有 PR（见 check-workflow-structure.sh 不变量 1 与 ci-triage skill）。
      #
      # 退出码语义：0=通过；1=违规；2=**无法检查**（缺 python3 等）—— 2 不等于通过，显式判红。
      # 本地同口径：scripts/preflight.sh 调用**同一个脚本**，不另写第二份实现。
      - name: Check task ledger consistency (台账一致性)
        run: |
          set +e
          bash .github/scripts/check-task-ledger.sh
          rc=$?
          set -e
          if [ "$rc" = "2" ]; then
            echo "::error::台账一致性检查【未验证】（缺 python3 等）—— 未验证不等于通过"
            exit 1
          fi
          exit "$rc"

      # 后端文件行数门禁 + 债务棘轮（BE-SIZE-001 / BE-LAYER-002）：机器化此前只有
      # 「人工 + PR 审查」的两条规则（实测已漂移 12 处：5 个 >500 行的 Go 文件 +
      # 3 个 >50 行的 cmd/server/main.go）。存量走 .github/file-size-baseline.txt（只减不增）。
      # 退出码语义：0=通过；1=违规；2=**无法检查**（缺 python3／基线缺失／基线格式错／扫不到 Go 文件）
      # —— 2 不等于通过，显式判红。本地同口径：scripts/preflight.sh 调用**同一个脚本**。
      - name: Check file size ratchet (文件行数棘轮)
        run: |
          set +e
          bash scripts/check-file-size.sh
          rc=$?
          set -e
          if [ "$rc" = "2" ]; then
            echo "::error::文件行数门禁【未验证】（缺 python3／基线缺失或格式错／扫不到 Go 文件）—— 未验证不等于通过"
            exit 1
          fi
          exit "$rc"

  # 契约破坏性变更检测（PR 专用）
  # bff.yaml 是前后端字段级契约的唯一事实源。frontend job 的 `npm run api:check` 只保证
  # 「生成类型与契约同步」（契约内部自洽），回答不了「已有客户端会不会被改挂」——
  # 缺的这一半由本 job 的 oasdiff 补上。两者合起来才是完整的契约防线。
  contract:
    name: Contract Breaking Change
    needs: changes
    runs-on: ubuntu-latest

    steps:
      # 与 frontend job 同构：job 级不加 if，无改动/非 PR 时也如实上报成功。
      # 否则被 job 级 if 跳过的 job 不上报检查记录 → 必需检查永远停在 Expected → 卡死所有 PR
      # （见 .github/scripts/check-workflow-structure.sh 不变量 1）。
      - name: Skipped (非 PR 或无 openapi 改动)
        if: needs.changes.outputs.openapi != 'true' || github.event_name != 'pull_request'
        run: echo "openapi/ 无改动或非 PR 事件，跳过契约破坏性检测（本检查已如实上报成功）"

      - name: Checkout
        if: needs.changes.outputs.openapi == 'true' && github.event_name == 'pull_request'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0     # 需要 origin/${{ github.base_ref }} 作为基线（fetch-depth: 0 取全部历史与分支）

      # 刻意不用 docker run（官方镜像是 Docker Hub 的 tufin/oasdiff）：本仓库已因匿名拉取
      # 限流连续红过多次（见 backend job 的 minio 注释）。改为下载官方 release 二进制并用
      # 同一 release 的 checksums.txt 校验 sha256：无镜像源依赖，版本与内容都可锁定。
      # 也不用官方 GitHub Action —— 它本身是 docker action，且默认把 spec 上传到 oasdiff.com。
      - name: Install oasdiff (pinned + checksum verified)
        if: needs.changes.outputs.openapi == 'true' && github.event_name == 'pull_request'
        run: |
          VERSION=1.33.0
          ASSET="oasdiff_${VERSION}_linux_amd64.tar.gz"
          BASE_URL="https://github.com/oasdiff/oasdiff/releases/download/v${VERSION}"
          curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -o "/tmp/${ASSET}" "${BASE_URL}/${ASSET}"
          curl -fsSL --retry 3 --retry-delay 2 --retry-connrefused -o /tmp/oasdiff-checksums.txt "${BASE_URL}/checksums.txt"
          # 只取本资产那一行比对 sha256（与官方 install.sh 同一做法），不匹配即失败，
          # 不会静默用上损坏/被替换的二进制
          EXPECTED=$(grep -E " ${ASSET}" /tmp/oasdiff-checksums.txt | awk '{print $1}')
          if [ -z "$EXPECTED" ]; then
            echo "::error::checksums.txt 中找不到 ${ASSET}"
            exit 1
          fi
          ACTUAL=$(sha256sum "/tmp/${ASSET}" | awk '{print $1}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::${ASSET} sha256 不匹配（expected=${EXPECTED} actual=${ACTUAL}）"
            exit 1
          fi
          echo "✓ sha256 校验通过：${ACTUAL}"
          mkdir -p /tmp/oasdiff-bin && tar -xzf "/tmp/${ASSET}" -C /tmp/oasdiff-bin
          echo "/tmp/oasdiff-bin" >> "$GITHUB_PATH"

      - name: Verify oasdiff
        if: needs.changes.outputs.openapi == 'true' && github.event_name == 'pull_request'
        run: command -v oasdiff && oasdiff --help > /dev/null && echo "✓ oasdiff 可用"

      - name: Detect breaking changes
        if: needs.changes.outputs.openapi == 'true' && github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.base_ref }}"
          if git diff --quiet "$BASE" -- openapi/bff.yaml; then
            echo "✓ bff.yaml 相对 $BASE 无改动，跳过 oasdiff"
            exit 0
          fi
          git show "$BASE:openapi/bff.yaml" > /tmp/contract-base.yaml
          cp openapi/bff.yaml /tmp/contract-head.yaml
          # --fail-on ERR 不可省：oasdiff breaking 默认【只打印、恒定退出码 0】
          # （上游 internal/run_test.go 的 Test_BasicBreakingChanges 断言的就是这一点：
          #  同一对 spec 不加 --fail-on 返回 0、加了 --fail-on ERR 才返回 1）。
          # 漏掉它就是一条永远绿的「假防线」——本 job 首版即踩此坑，故钉成注释。
          # 口径：ERR＝确定破坏（旧客户端按旧契约发的请求会失效）→ 阻断；
          #      WARN＝潜在破坏（契约信息不足以判定）→ 只打印不阻断，需要时提到 --fail-on WARN。
          # 处置：PR 描述标 BREAKING，同 PR 改前端并重新生成类型（见 openapi/README.md §3）。
          oasdiff breaking --fail-on ERR /tmp/contract-base.yaml /tmp/contract-head.yaml

  # 合并检查（所有检查通过后）
  merge-check:
    name: Merge Check
    runs-on: ubuntu-latest
    needs: [changes, frontend, backend, security, docs, contract]
    if: github.event_name == 'pull_request'

    steps:
      - name: All checks passed
        run: echo "All CI checks passed. Ready for human review."
