        （内置渠道防篡改）；再读 workspace 凭据状态得到 `authType` / `hasKey`（**不回传 key**），
        最后 BFF 自己发起真实 `GET <baseUrl>/` 并如实上报状态。

        仅允许 POST，且路径必须以 `/probe` 结尾，否则 `404`。请求体可省略或为空。
