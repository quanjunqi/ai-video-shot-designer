        id: {type: string}
        upload_id: {type: string}
        project_id: {type: string}
        episode_id: {type: string}
        kind:
          type: string
          enum: [character, prop, scene, other, script]
        scope:
          type: string
          enum: [project, global, episode]
        name: {type: string}
        prompt: {type: string}
        object_key: {type: string, description: 对象存储 key（S3 兼容）。}
        sha256: {type: string}
        byte_size: {type: integer}
        content_type: {type: string}
        status: {type: string, description: 取值以服务端为准，契约待补。}
        created_at: {type: string, format: date-time}
      additionalProperties: true

    CreateAssetUploadRequest:
      type: object
      required: [project_id, kind, scope, name]
      properties:
        project_id: {type: string}
        episode_id: {type: string}
        kind:
          type: string
          enum: [character, prop, scene, other, script]
        scope:
          type: string
          enum: [project, global, episode]
        name: {type: string}
        prompt: {type: string}
        sha256:
          type: string
          description: 可选，提交时用于校验内容哈希（不匹配则 `422 HASH_MISMATCH`）。
      additionalProperties: true

    AssetUploadSession:
      type: object
      required: [id, project_id, object_key, status, created_at]
      properties:
        id: {type: string}
        project_id: {type: string}
        object_key: {type: string}
        status: {type: string, description: 取值以服务端为准，契约待补。}
        created_at: {type: string, format: date-time}
      additionalProperties: true

    TaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 上游固定返回最多 50 条。
          items: {$ref: '#/components/schemas/Task'}
      additionalProperties: false

    Task:
      type: object
      description: 任务（Job）。
      required:
        - id
        - kind
        - label
        - status
        - progress
        - attempt
        - created_at
        - updated_at
      properties:
        id: {type: string}
        kind:
          type: string
          enum: [split, interpret, image, video, audio, canvas_export]
        label: {type: string}
        project_id: {type: string}
        episode_id: {type: string}
        asset_id: {type: string}
        shot_id: {type: string}
        status:
          type: string
          enum: [queued, running, succeeded, failed, cancelled]
        progress:
          type: number
          description: 进度（0–1 或 0–100 由服务端定义，契约待补）。
        attempt: {type: integer}
        steps:
          type: array
          items:
            type: object
            required: [label, done]
            properties:
              label: {type: string}
              done: {type: boolean}
            additionalProperties: true
        intent_payload:
          description: 载荷，服务端可能返回对象、JSON 字符串或 null。
          oneOf:
            - type: object
              additionalProperties: true
            - type: string
            - type: 'null'
        cost_estimate: {type: string, description: 成本估算（字符串，如货币金额）。}
        error: {type: string}
        context_path: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      additionalProperties: true

    CreateTaskRequest:
      type: object
      required: [kind, label]
      properties:
        kind:
          type: string
          enum: [split, interpret, image, video, audio, canvas_export]
        label: {type: string}
        project_id: {type: string}
        episode_id: {type: string}
        asset_id: {type: string}
        shot_id: {type: string}
        steps:
          type: array
          items:
            type: object
            required: [label, done]
            properties:
              label: {type: string}
              done: {type: boolean}
            additionalProperties: true
        cost_estimate: {type: string}
        context_path: {type: string}
        payload:
          type: object
          additionalProperties: true
          description: 前端字段名；上游以 `intent_payload` 持久化（BFF 不重命名，直接透传）。字段以服务端为准。
      additionalProperties: true

    RunModelTestRequest:
      type: object
      required: [modelId]
      properties:
        modelId: {type: string, description: 目录模型 id；缺失返回 `422 INVALID_RUN`。}
        runtime:
          type: object
          additionalProperties: true
          description: |
            role=runtime 协议参数的业务取值（如 prompt、尺寸等）。具体键由模型/协议模板定义，
            字段以服务端为准，契约待补。
      additionalProperties: false

    RunModelTestResponse:
      type: object
      required: [ok, run]
      properties:
        ok: {type: boolean, description: 上游调用是否成功（失败时 HTTP 仍为 200）。}
        run: {$ref: '#/components/schemas/GenerateRun'}
      additionalProperties: false

    GenerateRun:
      type: object
      description: 引擎执行轨迹（不回传任何凭据）。
      required: [status, duration]
      properties:
        status:
          type: integer
          description: 上游渠道返回的 HTTP 状态码（不是 BFF 的响应码）。
        extracted:
          description: 按协议模板 responseParams 抽取的结果。
          oneOf:
            - type: object
              additionalProperties: true
            - type: 'null'
        rawBody: {type: string, description: 上游原始响应体（可能被截断，以服务端为准）。}
        duration: {type: string, description: Go duration 字符串，如 `1.234s`。}
        error: {type: string}
      additionalProperties: true

    GenerateRequest:
      type: object
      required: [modelId]
      properties:
        modelId: {type: string, description: 目录模型 id；缺失返回 `422 INVALID_GENERATE`。}
        modality:
          type: string
          enum: [text, image, video, audio]
        mode:
          type: string
          description: |
            业务模式名（如文生图/图生图等），取值必须命中协议模板 `capabilities` 声明的 mode；
            具体取值以服务端为准，契约待补。
        input:
          type: object
          additionalProperties: true
          description: 业务输入（prompt、reference_images 等）；字段以服务端为准，契约待补。
        parameters:
          type: object
          additionalProperties: true
          description: 生成参数；字段以服务端为准，契约待补。
        metadata:
          type: object
          additionalProperties: true
          description: 透传元数据（写入审计日志 `metadata`）；字段以服务端为准。
      additionalProperties: true

    GenerateResponse:
      type: object
      description: |
        同步生成结果。成功：`{ok: true, status: "succeeded", output, run}`；
        失败：`{ok: false, status: "failed", error, run}`（HTTP 均为 200）。
      properties:
        ok: {type: boolean}
        status: {type: string, enum: [succeeded, failed]}
        output:
          type: object
          additionalProperties: true
          description: 抽取后的生成结果；字段以服务端为准，契约待补。
        poll_url:
          type: string
          description: 异步分支才有；见 path 描述中关于 `/internal/v1/...` 前缀的已知问题。
        error: {type: string}
        run: {$ref: '#/components/schemas/GenerateRun'}
      additionalProperties: true

    GenerateAsyncAccepted:
      type: object
      description: 异步模板返回（HTTP 202）。
      required: [task_id, status, poll_url]
      properties:
        task_id: {type: string, description: '即任务 id，可用于 /api/v1/tasks/{taskId}。'}
        status: {type: string, description: 新建任务的初始状态（服务端返回，通常为 `queued`）。}
        poll_url:
          type: string
          description: |
            上游组装的轮询地址。**已知问题**：当前为 `/internal/v1/tasks/{task_id}`，
            并非浏览器可直接访问的 BFF 路径；请改用 `/api/v1/tasks/{task_id}`。
      additionalProperties: false

    AuditLogList:
      type: object
      required: [items, total, limit, offset]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AuditLog'}
        total:
          type: integer
          description: '筛选后的全量总数（COUNT(*) OVER()），不是当前页条数。'
        limit: {type: integer}
        offset: {type: integer}
        stats:
          type: object
          description: |
            在**筛选后全集**上的统计（D7a）。前端必须用它，不得在"当前页"上自行统计。
            聚合失败时 `byStatus` 为 null（`success`/`avgLatencyMs` 为 0）—— 契约如实反映这一点。
          required: [byStatus, success, successRate, avgLatencyMs, p50LatencyMs, p95LatencyMs, aggregateOn]
          properties:
            byStatus:
              type: object
              nullable: true
              additionalProperties: {type: integer}
              description: 各状态计数；上游聚合失败时为 null
            success: {type: integer}
            successRate: {type: number, description: 'success / total（服务端算）'}
            avgLatencyMs: {type: integer}
            p50LatencyMs:
              type: integer
              description: >-
                筛选后全集上的耗时中位数（④ §2.3）。**排除 latency_ms = 0 的行** ——
                0 表示"没有测量到"而不是"瞬时完成"；计入会把 P50 拉成 0，让耗时分布成为假象。
            p95LatencyMs:
              type: integer
              description: 筛选后全集上的耗时 P95（同上，排除 0）。空集时为 0。
            aggregateOn: {type: string, description: '固定为 filtered_total'}
          additionalProperties: false
      additionalProperties: false

    AuditLog:
      type: object
      description: 网关审计日志（所有 AI 调用必经此记录）。
      required:
        - id
        - request_id
        - workspace_id
        - product
        - model_id
        - mode
        - request_payload
        - status
        - latency_ms
        - token_input
        - token_output
        - token_cached
        - cost_amount
        - cost_currency
        - created_at
      properties:
        id: {type: integer}
        request_id: {type: string}
        workspace_id: {type: string}
        project_id: {type: string}
        episode_id: {type: string}
        asset_id: {type: string}
        user_id: {type: string}
        product: {type: string, description: 产品线标识，取值以服务端为准。}
        model_id: {type: string}
        channel_id: {type: string}
        provider_model: {type: string}
        mode: {type: string}
        request_payload: {type: object, additionalProperties: true}
        response_payload: {type: object, additionalProperties: true}
        error_message: {type: string}
        status: {type: string, description: 取值以服务端为准（如 success/failed/queued），契约待补。}
        latency_ms: {type: integer}
        token_input: {type: integer}
        token_output: {type: integer}
        token_cached: {type: integer}
        cost_amount: {type: number}
        cost_currency: {type: string}
        job_id: {type: string}
        provider_task_id: {type: string}
        created_at: {type: string, format: date-time}
      additionalProperties: true

    ProbeRequest:
      type: object
      description: 自定义渠道需要提供 baseUrl；内置渠道可省略或传空对象。
      properties:
        baseUrl:
          type: string
          description: 自定义渠道的接口地址；为空时 BFF 从平台目录取（内置渠道防篡改）。
        authType:
          type: string
          description: |
            渠道鉴权方式，影响探测时发送的占位头：`bearer` → `Authorization: Bearer <REDACTED>`、
            `apikey` → `X-API-Key: <REDACTED>`、`sign` → `Authorization: Sign <REDACTED>`；
            其它值（含 `none`/空）不发送鉴权头。凭据状态里配置了 authType 时以凭据为准。
      additionalProperties: false

    ProbeResult:
      type: object
      description: |
        BFF 边缘探测结果。网络不可达时仍是 `200`，`reachable=false` 且 `detail` 说明原因；
        未配置凭据时 `authConfigured=false`，不发送鉴权头，`authOk` 不出现。
      required: [channelId, reachable, authConfigured, detail, probedAt]
      properties:
        channelId: {type: string}
        reachable: {type: boolean}
        authConfigured: {type: boolean, description: 是否已配置该渠道凭据（`hasKey`）。}
        authOk:
          type: boolean
          description: 仅在有凭据且探测完成时出现；2xx 视为通过。
        statusCode:
          type: integer
          description: 仅 `reachable=true` 时出现，是被探测端返回的 HTTP 状态码。
        detail: {type: string, description: 中文说明文案（如「网络不可达：...」）。}
        probedAt: {type: string, format: date-time, description: UTC RFC3339。}
      additionalProperties: false

    CatalogDirectory:
      type: object
      description: 平台共享模型目录快照（channels / models / templates）。
      required: [channels, models, templates]
      properties:
        channels:
          type: array
          items: {$ref: '#/components/schemas/CatalogChannel'}
        models:
          type: array
          items: {$ref: '#/components/schemas/CatalogModel'}
        templates:
          type: array
          items: {$ref: '#/components/schemas/ProtocolTemplate'}
      additionalProperties: true

    CatalogChannel:
      type: object
      required: [id, name, kind, baseUrl, authType, enabled, note, sort]
      properties:
        id: {type: string, description: 'chan_ 前缀，或内置 id（jimeng / minimax / grsai / google / openai / comfy）。'}
        name: {type: string}
        kind:
          type: string
          enum: [official, aggregator, local]
        baseUrl: {type: string}
        authType:
          type: string
          enum: [bearer, none]
          description: 目录侧声明的鉴权类型；工作区凭据侧的 authType 还可能出现 `apikey`/`sign`，以服务端为准。
        enabled: {type: boolean}
        note: {type: string}
        sort: {type: integer}
      additionalProperties: true

    CatalogChannelPatch:
      type: object
      description: 上游 `DisallowUnknownFields`，只能传以下字段。
      properties:
        name: {type: string}
        baseUrl: {type: string}
        authType:
          type: string
          enum: [bearer, none]
        enabled: {type: boolean}
        note: {type: string}
        sort: {type: integer}
      additionalProperties: false

    CatalogModel:
      type: object
      required:
        - id
        - channelId
        - family
        - name
        - type
        - status
        - sort
        - note
        - capability
        - version
      properties:
        id: {type: string}
        channelId: {type: string}
        family: {type: string}
        name: {type: string}
        providerModel: {type: string}
        type:
          type: string
          enum: [text, image, video]
        status:
          type: string
          enum: [enabled, disabled]
        sort: {type: integer}
        note: {type: string}
        protocolTemplateId: {type: string}
        requestPath: {type: string, description: 覆盖协议模板的请求路径（可选）。}
        method:
          type: string
          enum: [POST, GET]
        params:
          type: array
          items: {$ref: '#/components/schemas/ModelParam'}
        responseParams:
          type: array
          items: {$ref: '#/components/schemas/ModelParam'}
        capability:
          type: object
          additionalProperties: true
          description: 能力声明（JSONB）；键集合以服务端/协议模板为准，契约待补。
        version: {type: integer}
      additionalProperties: true

    ModelParam:
      type: object
      description: 协议参数映射项（禁止在代码中硬编码映射，一律走此结构）。
      required: [key, value]
      properties:
        key: {type: string}
        value: {type: string}
        type: {type: string, description: 可选类型标注，取值以服务端为准。}
      additionalProperties: true

    CreateCatalogModelRequest:
      type: object
      description: |
        前端类型为 `Omit<ServerCatalogModel, 'id' | 'version'>`；上游 `DisallowUnknownFields`
        解码 `catalog.Model`，字段名必须严格匹配，多传/少传必填都会被拒。
      required:
        - channelId
        - family
        - name
        - type
        - status
        - sort
        - note
        - capability
      properties:
        channelId: {type: string}
        family: {type: string}
        name: {type: string}
        providerModel: {type: string}
        type:
          type: string
          enum: [text, image, video]
        status:
          type: string
          enum: [enabled, disabled]
        sort: {type: integer}
        note: {type: string}
        protocolTemplateId: {type: string}
        requestPath: {type: string}
        method:
          type: string
          enum: [POST, GET]
        params:
          type: array
          items: {$ref: '#/components/schemas/ModelParam'}
        responseParams:
          type: array
          items: {$ref: '#/components/schemas/ModelParam'}
        capability:
          type: object
          additionalProperties: true
      additionalProperties: false

    CatalogModelPatch:
      type: object
      description: 上游 `DisallowUnknownFields`，只能传以下字段；全部可选。
      properties:
        channelId: {type: string}
        family: {type: string}
        name: {type: string}
        providerModel: {type: string}
        type:
          type: string
          enum: [text, image, video]
        status:
          type: string
          enum: [enabled, disabled]
        sort: {type: integer}
        note: {type: string}
        protocolTemplateId: {type: string}
        requestPath: {type: string}
        method:
          type: string
          enum: [POST, GET]
        params:
          type: array
          items: {$ref: '#/components/schemas/ModelParam'}
        responseParams:
          type: array
          items: {$ref: '#/components/schemas/ModelParam'}
        capability:
          type: object
          additionalProperties: true
      additionalProperties: false

    ProtocolTemplate:
      type: object
      description: 协议模板：声明 HTTP 方法/路径/参数映射与异步轮询规则。
      required:
        - id
        - label
        - desc
        - method
        - requestPath
        - params
        - responseParams
        - builtin
        - enabled
        - refCount
        - version
      properties:
        id: {type: string}
        label: {type: string}
        desc: {type: string}
        method:
          type: string
          enum: [POST, GET]
        requestPath: {type: string}
        params:
          type: array
          items: {$ref: '#/components/schemas/ModelParam'}
        responseParams:
          type: array
          items: {$ref: '#/components/schemas/ModelParam'}
        async:
          type: object
          description: 异步任务轮询配置；省略表示同步模板。
          required: [enabled, taskIdField, statusField, doneValue, failValue]
          properties:
            enabled: {type: boolean}
            taskIdField: {type: string}
            statusField: {type: string}
            doneValue: {type: string}
            failValue: {type: string}
          additionalProperties: true
        builtin: {type: boolean, description: 内置模板受保护，不可改/删（`400 BUILTIN_PROTECTED`）。}
        enabled: {type: boolean}
        refCount: {type: integer, description: 被模型引用次数；>0 时不可删（`409 TEMPLATE_IN_USE`）。}
        docRef:
          type: object
          nullable: true
          description: >-
            ADR-008 文档依据（**外部输入**，可能过期或本身有误）：source(official|cloud|relay) /
            url / docVersion|verifiedAt / sections / authDoc / statusEnumDoc / referenceRuleDoc。
            NULL = 尚未对齐文档。
        observedEvidence:
          type: object
          nullable: true
          description: >-
            ADR-008 实测证据（**事实**）：lastProbedAt / observedStatusCodes / observedStatusEnum /
            observedEndpoints / discrepancies[]。冲突时以本列为准，且**差异必须保留可见**。
            NULL = 尚未实测。
        version: {type: integer}
        capabilities:
          type: object
          additionalProperties: true
          description: 模板侧的能力声明（capability JSONB）。前端 TS 未声明该字段，但 production 会返回，以服务端为准。
      additionalProperties: true

    CreateProtocolTemplateRequest:
      type: object
      required: [label, desc, requestPath, method, params, responseParams]
      properties:
        label: {type: string}
        desc: {type: string}
        requestPath: {type: string}
        method:
          type: string
          enum: [POST, GET]
        params:
          type: array
          items: {$ref: '#/components/schemas/ModelParam'}
        responseParams:
          type: array
          items: {$ref: '#/components/schemas/ModelParam'}
        async:
          type: object
          required: [enabled, taskIdField, statusField, doneValue, failValue]
          properties:
            enabled: {type: boolean}
            taskIdField: {type: string}
            statusField: {type: string}
            doneValue: {type: string}
            failValue: {type: string}
          additionalProperties: true
      additionalProperties: true

    ProtocolTemplatePatch:
      type: object
      description: 前端发送 `Partial<...>`，字段全部可选。
      properties:
        label: {type: string}
        desc: {type: string}
        requestPath: {type: string}
        method:
          type: string
          enum: [POST, GET]
        params:
          type: array
          items: {$ref: '#/components/schemas/ModelParam'}
        responseParams:
          type: array
          items: {$ref: '#/components/schemas/ModelParam'}
        async:
          type: object
          properties:
            enabled: {type: boolean}
            taskIdField: {type: string}
            statusField: {type: string}
            doneValue: {type: string}
            failValue: {type: string}
          additionalProperties: true
        enabled: {type: boolean}
      additionalProperties: true

    ModelCapabilities:
      type: object
      required: [model_id, model_name, model_type, capability]
      properties:
        model_id: {type: string}
        model_name: {type: string}
        model_type: {type: string, description: 取值以服务端为准（通常同 CatalogModel.type）。}
        capability: {type: object, additionalProperties: true}
        protocol_template_id: {type: string}
        protocol_template_label: {type: string}
        capabilities:
          type: object
          additionalProperties: true
          description: 所挂协议模板的能力声明。
        supported_modes:
          type: array
          items: {type: string}
          description: 由模板 capabilities 的键推导出的 mode 列表。
      additionalProperties: true

    RuleTemplateList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/RuleTemplate'}
      additionalProperties: false

    RuleTemplate:
      type: object
      required:
        - workspace_id
        - id
        - kind
        - name
        - description
        - content
        - config
        - version
        - version_history
        - builtin
        - enabled
        - created_at
        - updated_at
      properties:
        workspace_id: {type: string}
        id: {type: string}
        kind:
          type: string
          enum: [split, prompt]
        name: {type: string}
        description: {type: string}
        stage: {type: string}
        content: {type: string}
        config:
          type: object
          additionalProperties: true
          description: 规则配置；字段以服务端为准，契约待补。
        version: {type: integer}
        version_history:
          type: array
          items:
            type: object
            required: [version, savedAt, snapshot]
            properties:
              version: {type: integer}
              savedAt: {type: integer}
              note: {type: string}
              snapshot: {type: object, additionalProperties: true}
            additionalProperties: true
        builtin: {type: boolean}
        enabled: {type: boolean}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      additionalProperties: true

    CreateRuleTemplateRequest:
      type: object
      required: [id, kind, name]
      properties:
        id: {type: string, description: 由前端指定模板 id。}
        kind:
          type: string
          enum: [split, prompt]
        name: {type: string}
        description: {type: string}
        stage: {type: string}
        content: {type: string}
        config:
          type: object
          additionalProperties: true
        builtin: {type: boolean}
        enabled: {type: boolean}
      additionalProperties: true

    RuleTemplatePatch:
      type: object
      description: 前端发送 `Partial<ServerRuleTemplate>`，即 RuleTemplate 的全部字段均可选。
      additionalProperties: true

    CredentialStatusList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CredentialStatus'}
      additionalProperties: false

    CredentialStatus:
      type: object
      description: 渠道凭据状态（**永不包含明文 key**）。
      required: [channelId, baseUrl, authType, hasKey, enabled, updatedAt]
      properties:
        channelId: {type: string}
        baseUrl: {type: string}
        authType: {type: string, description: 取值以服务端为准（见 `bearer`/`apikey`/`sign`/`none`）。}
        hasKey: {type: boolean}
        enabled: {type: boolean}
        updatedAt: {type: string, description: 服务端以字符串返回（store 定义为 string），非 RFC3339 保证。}
      additionalProperties: true

    CredentialUpsertRequest:
      type: object
      description: |
        上游 `DisallowUnknownFields`，且要求 `channelId` 与 URL 路径一致。
        `apiKey` 只写不读。
      required: [channelId, baseUrl, authType]
      properties:
        channelId: {type: string, description: '必须与路径中的 {channelId} 相同，否则 400 INVALID_BODY。'}
        baseUrl: {type: string}
        authType: {type: string, description: 取值以服务端为准（如 `bearer`/`apikey`/`sign`/`none`）。}
        apiKey:
          type: string
          writeOnly: true
          description: 明文密钥，只写不读：不落日志、不回显、列表接口不返回。省略表示仅更新 baseUrl/authType。
      additionalProperties: false

    CredentialStored:
      type: object
      required: [channelId, stored]
      properties:
        channelId: {type: string}
        stored: {type: boolean}
      additionalProperties: false

    CredentialReveal:
      type: object
      description: |
        唯一返回明文 key 的响应。仅用于显式的「显示密钥」动作；不要缓存、不要落日志。
      required: [channelId, baseUrl, authType, apiKey]
      properties:
        channelId: {type: string}
        baseUrl: {type: string}
        authType: {type: string}
        apiKey: {type: string, description: 解密后的明文密钥。}
      additionalProperties: false

    UserChannelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/UserChannel'}
      additionalProperties: false

    UserChannel:
      type: object
      description: 租户自有渠道（非平台目录）。
      required: [id, name, kind, baseUrl, authType, enabled, note]
      properties:
        id: {type: string}
        name: {type: string}
        kind:
          type: string
          enum: [official, aggregator, local]
        protocol:
          type: string
          description: 服务端缺省为 `api`；可能取 `api` | `local`。
        baseUrl: {type: string}
        authType: {type: string, description: 写入时服务端只接受 `bearer` | `none`。}
        enabled: {type: boolean}
        note: {type: string}
        sort: {type: integer}
        updatedAt: {type: string}
      additionalProperties: true

    UserChannelUpsertRequest:
      type: object
      description: |
        上游 `DisallowUnknownFields`；`channelId` 只来自 URL 路径，body 中**没有** id 字段。
        服务端约束：name 必填；kind ∈ official|aggregator|local；authType ∈ bearer|none；
        protocol ∈ api|local（缺省 api）；enabled 缺省 true；sort 缺省 0。
      required: [name, kind, baseUrl, authType, enabled, note]
      properties:
        name: {type: string}
        kind:
          type: string
          enum: [official, aggregator, local]
        protocol:
          type: string
          enum: [api, local]
        baseUrl: {type: string}
        authType:
          type: string
          enum: [bearer, none]
        enabled: {type: boolean}
        note: {type: string}
        sort: {type: integer, description: 前端未发送；服务端支持。}
      additionalProperties: false

    UserChannelSaved:
      type: object
      required: [channel]
      properties:
        channel: {$ref: '#/components/schemas/UserChannel'}
      additionalProperties: false

    LogicalModel:
      type: object
      description: |
        逻辑模型（ADR-003 §3.1）：对外唯一标识 `id` + 展示用 `label`。
        必填依据 production `catalog.LogicalModel` 的 JSON 字段（无 omitempty）。
      required:
        - id
        - label
        - type
        - capability
        - status
        - sort
        - note
        - createdBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          maxLength: 64
          description: 能力型 kebab-case；创建后不可修改。
        label: {type: string, maxLength: 200, description: 展示名；改名用此字段。}
        type:
          type: string
          enum: [text, image, video]
        capability:
          type: string
          description: 能力声明（如 `image.t2i`）；上游未做格式校验，字段以服务端为准。
        status:
          type: string
          enum: [enabled, disabled]
        sort: {type: integer, minimum: 0, description: 目录排序，缺省 100。}
        note: {type: string}
        createdBy: {type: string, description: 创建者 actor id。}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      additionalProperties: true

    CreateLogicalModelRequest:
      type: object
      description: |
        上游 `DisallowUnknownFields`（未知字段 → `400 INVALID_BODY`），因此不接受
        `createdBy`/`createdAt`/`updatedAt` 等只读字段。
      required: [id, label, type]
      properties:
        id:
          type: string
          maxLength: 64
          description: 能力型 kebab-case，由调用方指定；已存在 → `409 DUPLICATE_LOGICAL_MODEL`。
        label: {type: string, maxLength: 200}
        type:
          type: string
          enum: [text, image, video]
        capability: {type: string}
        status:
          type: string
          enum: [enabled, disabled]
        sort: {type: integer, minimum: 0}
        note: {type: string}
      additionalProperties: false

    UpdateLogicalModelRequest:
      type: object
      description: |
        局部更新：省略字段保持原值（`sort` 可显式传 0）。
        `id` 只用于表达「改名意图」——与路径 id 不一致时返回 `400 ID_IMMUTABLE`，
        与路径一致则被忽略（不写库）。未知字段 → `400 INVALID_BODY`。
      properties:
        id: {type: string, description: 仅用于探测改名意图；不参与写入。}
        label: {type: string, maxLength: 200}
        type:
          type: string
          enum: [text, image, video]
        capability: {type: string}
        status:
          type: string
          enum: [enabled, disabled]
        sort: {type: integer, minimum: 0}
        note: {type: string}
      additionalProperties: false

    LogicalModelCandidate:
      type: object
      description: |
        某逻辑模型下的候选行（= model_catalog 一行，只读视图）。
        路由尝试顺序由 `routePriority` 决定，**小者优先**。
      required:
        - id
        - logicalModelId
        - name
        - family
        - channelId
        - providerModel
        - type
        - status
        - routePriority
      properties:
        id: {type: string, description: model_catalog 行 id。}
        logicalModelId: {type: string}
        name: {type: string}
        family: {type: string}
        channelId: {type: string}
        providerModel: {type: string}
        type:
          type: string
          enum: [text, image, video]
        status:
          type: string
          enum: [enabled, disabled]
          description: 该候选行自身的启用状态（model_catalog.status）。
        routePriority: {type: integer, minimum: 0, description: 路由尝试顺序，小者优先；缺省 100。}
      additionalProperties: true

    BindLogicalModelCandidatesRequest:
      type: object
      description: |
        上游 `DisallowUnknownFields`。`modelIds` 非空、每项非空白且 ≤128 字符；
        同一 id 重复出现是幂等的（去重后保留首次出现顺序）。
      required: [modelIds]
      properties:
        modelIds:
          type: array
          minItems: 1
          items: {type: string, maxLength: 128}
        routePriority: {type: integer, minimum: 0, description: 省略时上游使用默认值 100。}
      additionalProperties: false
