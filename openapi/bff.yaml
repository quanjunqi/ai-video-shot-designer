        `apiKey` 只写不读：不落日志、不回显、不返回。
        上游错误：`400 INVALID_BODY`、`503 CREDENTIAL_UNAVAILABLE`（如 `WORKSPACE_CRED_KEY` 未配置）。
      x-upstream: {service: workspace, method: PUT, path: '/internal/v1/workspaces/{workspace_id}/credentials/{channel_id}'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CredentialUpsertRequest'}
      responses:
        '200':
          description: 已写入
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CredentialStored'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}
    delete:
      operationId: deleteChannelCredential
      tags: [工作区凭据]
      summary: 删除渠道凭据
      description: 转发到 workspace `DELETE .../credentials/{channel_id}`，成功返回 `204`。
      x-upstream: {service: workspace, method: DELETE, path: '/internal/v1/workspaces/{workspace_id}/credentials/{channel_id}'}
      responses:
        '204':
          description: 已删除
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}

  /api/v1/workspace/credentials/{channelId}/reveal:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    get:
      operationId: revealChannelCredential
      tags: [工作区凭据]
      summary: 读取渠道凭据明文
      description: |
        转发到 workspace `GET .../credentials/{channel_id}/reveal`，返回
        `{channelId, baseUrl, authType, apiKey}` —— 这是**唯一**返回明文 key 的接口，
        供显式的「显示密钥」动作使用；不要缓存、不要写日志。
        上游错误：`404 NOT_FOUND`（未配置）、`503 CREDENTIAL_UNAVAILABLE`（解密失败，如
        `WORKSPACE_CRED_KEY` 不匹配）。
      x-upstream: {service: workspace, method: GET, path: '/internal/v1/workspaces/{workspace_id}/credentials/{channel_id}/reveal'}
      responses:
        '200':
          description: 凭据明文
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CredentialReveal'}
        '404': {$ref: '#/components/responses/NotFound'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}

  /api/v1/workspace/channels:
    get:
      operationId: listUserChannels
      tags: [工作区渠道]
      summary: 列出工作区自有渠道
      description: |
        转发到 workspace `GET /internal/v1/workspaces/{workspace_id}/channels`，
        返回 `{items: UserChannel[]}`。这是租户自有渠道，**不是**平台目录（`/api/v1/catalog`）。
      x-upstream: {service: workspace, method: GET, path: '/internal/v1/workspaces/{workspace_id}/channels'}
      responses:
        '200':
          description: 渠道列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserChannelList'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}

  /api/v1/workspace/channels/{channelId}:
    parameters:
      - $ref: '#/components/parameters/ChannelId'
    put:
      operationId: putUserChannel
      tags: [工作区渠道]
      summary: 新建/更新工作区渠道
      description: |
        转发到 workspace `PUT .../channels/{channel_id}`（`DisallowUnknownFields`）。
        `channelId` 只来自 URL 路径（body 里没有 id 字段）。
        上游字段约束：`name` 必填；`kind` ∈ `official|aggregator|local`；
        `authType` ∈ `bearer|none`；`protocol` ∈ `api|local`（缺省 `api`）；
        `enabled` 缺省 `true`；`sort` 缺省 `0`。
        上游错误：`400 INVALID_CHANNEL` / `INVALID_KIND` / `INVALID_AUTH` / `INVALID_PROTOCOL` /
        `INVALID_BODY`、`503 CHANNEL_UNAVAILABLE`。
      x-upstream: {service: workspace, method: PUT, path: '/internal/v1/workspaces/{workspace_id}/channels/{channel_id}'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UserChannelUpsertRequest'}
      responses:
        '200':
          description: 已保存（返回保存后的渠道）
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserChannelSaved'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}
    delete:
      operationId: deleteUserChannel
      tags: [工作区渠道]
      summary: 删除工作区渠道
      description: |
        转发到 workspace `DELETE .../channels/{channel_id}`。服务端会**级联清理**该渠道的加密凭据，
        成功返回 `204`。上游错误：`503 CHANNEL_UNAVAILABLE`。
      x-upstream: {service: workspace, method: DELETE, path: '/internal/v1/workspaces/{workspace_id}/channels/{channel_id}'}
      responses:
        '204':
          description: 已删除（含级联清除凭据）
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}

components:
  securitySchemes:
    internalServiceToken:
      type: http
      scheme: bearer
      bearerFormat: static-internal-token
      description: |
        **服务间令牌，不是浏览器凭据。** BFF 在每个转发请求上设置
        `Authorization: Bearer <SERVICE>_INTERNAL_TOKEN`，变量名见 `.env.example`：
        `WORKSPACE_INTERNAL_TOKEN` / `PRODUCTION_INTERNAL_TOKEN` /
        `EXECUTION_INTERNAL_TOKEN` / `ASSET_INTERNAL_TOKEN`（启动时四个都必须非空，
        否则 BFF 直接 `log.Fatal`）。领域服务用常量时间比较校验，未通过返回
        `401 UNAUTHENTICATED`。
        把它写进本规范只为如实说明内部跳的鉴权方式；**浏览器不应实现它**。
    workspaceTrustedContext:
      type: apiKey
      in: header
      name: X-Workspace-Id
      description: |
        **BFF 注入的信任上下文，不是浏览器凭据。** BFF 把
        `X-Workspace-Id: $BFF_DEV_WORKSPACE_ID`（默认 `ws_dev`）与
        `X-Actor-Id: $BFF_DEV_ACTOR_ID`（默认 `user_dev`，`.env.example` 示例值为
        `actor_local`）注入到所有领域服务请求；领域服务要求两者非空，否则
        `400 INVALID_CONTEXT`。workspace 的路径参数 `{workspace_id}` 也直接使用该固定值。
        当前浏览器侧**不发送任何身份头**：根级 `security: []` 即表示 `/api/v1/*`
        不要求调用方凭据（详见 info.description「鉴权现状」）。
    futureOidc:
      type: openIdConnect
      openIdConnectUrl: https://example.invalid/.well-known/openid-configuration
      description: |
        **占位：尚未接入。** `docker-compose` 提供了 Keycloak 容器，但代码中没有任何
        JWT/OIDC 校验（见 `docs/architecture/01-c4-context-container.md`「信任模型」与
        「能力矩阵」）。生产化目标态是浏览器携带 OIDC 会话、BFF 校验后换取真实身份；
        在此之前**不要**把它当作可用鉴权方式。URL 为无效占位符，刻意不指向任何真实服务。

  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 128
      description: |
        幂等键（ASCII，≤128 字符）。可选：BFF 在 POST comic-projects /
        generation-intents / tasks 时若缺失会自动生成 `bff_<32hex>` 再转发；
        携带同一键重放会得到上游的既有资源（HTTP `200` 而非 `201`）。
        上游对格式非法返回 `400 INVALID_IDEMPOTENCY_KEY`。
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: {type: string}
      description: 项目 id（production 删除接口校验形如 `proj_` + 32 位十六进制，共 37 字符）。
    EpisodeId:
      name: episodeId
      in: path
      required: true
      schema: {type: string}
      description: 剧集 id（由前端 `createEpisode` 指定）。
    AssetId:
      name: assetId
      in: path
      required: true
      schema: {type: string}
      description: 单集资产 id。
    CharacterId:
      name: characterId
      in: path
      required: true
      schema: {type: string}
      description: 项目级角色 id。
    TemplateId:
      name: templateId
      in: path
      required: true
      schema: {type: string}
      description: 模板 id（协议模板或规则模板）。
    ChannelId:
      name: channelId
      in: path
      required: true
      schema: {type: string}
      description: |
        渠道 id。在 `/api/v1/workspace/channels/{channelId}` 中同时是路径与主体 id；
        在 `/api/v1/channels/{channelId}/probe` 中用于查目录/凭据。
    ModelId:
      name: modelId
      in: path
      required: true
      schema: {type: string}
      description: 目录模型 id（存量内置模型可能不是 `mod_` 前缀）。
    LogicalModelId:
      name: logicalModelId
      in: path
      required: true
      schema: {type: string, maxLength: 64}
      description: |
        逻辑模型 id：非空、能力型 kebab-case（小写字母/数字、单连字符分隔、≤64 字符）。
        一经对外使用即成契约，**不可修改**（改名用 `label`）。
    TaskId:
      name: taskId
      in: path
      required: true
      schema: {type: string}
      description: 任务（Job）id。
    IntentId:
      name: intentId
      in: path
      required: true
      schema: {type: string}
      description: 生成意图 id。
    UploadId:
      name: uploadId
      in: path
      required: true
      schema: {type: string}
      description: 上传会话 id（来自 `POST /api/v1/assets/uploads` 的 `id`）。
    TaskStatusQuery:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [queued, running, succeeded, failed, cancelled]
      description: 按任务状态过滤。
    TaskKindQuery:
      name: kind
      in: query
      required: false
      schema:
        type: string
        enum: [split, interpret, image, video, audio, canvas_export]
      description: 按任务类型过滤。
    LimitQuery:
      name: limit
      in: query
      required: false
      schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      description: 每页条数（上游仅接受 1–200，其它值静默回退 50）。
    OffsetQuery:
      name: offset
      in: query
      required: false
      schema: {type: integer, minimum: 0, default: 0}
      description: 偏移量（上游仅接受 >=0，其它值静默回退 0）。

  responses:
    BadRequest:
      description: 请求不合法（JSON 解析失败、body 过大、必填缺失、Idempotency-Key 非法等）。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Unauthenticated:
      description: |
        上游内部鉴权失败。正常情况下不应被浏览器看到（令牌由 BFF 注入）；
        出现说明 BFF 的 `*_INTERNAL_TOKEN` 配置有误。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Forbidden:
      description: |
        workspace 授权失败：BFF 以固定身份调用 workspace
        `/internal/v1/workspaces/{id}/authorize?actor_id=...` 得到 `403`，
        随即以 `403 FORBIDDEN` 返回（不访问领域服务）。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    NotFound:
      description: 资源不存在，或路径形状不被上游识别。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    MethodNotAllowed:
      description: 方法不被允许（BFF 或上游返回 `405`）。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    Conflict:
      description: 冲突（幂等键冲突、资源已存在、状态不允许操作等）。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    PayloadTooLarge:
      description: 上传内容超过 `ASSET_MAX_BYTES`。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UnprocessableEntity:
      description: 语义校验失败（字段缺失、枚举非法、凭据缺失、映射参数缺失等）。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
    UpstreamUnavailable:
      description: |
        领域服务不可达或未就绪（Docker/K8s 场景多为连接失败）。BFF 的
        `UPSTREAM_UNAVAILABLE` 与上游的 `*_UNAVAILABLE` / `NOT_READY` 都归入此类。
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}

  schemas:
    Error:
      type: object
      description: |
        统一错误体（**无全局 envelope**）：所有错误响应都是
        `{"code": "...", "message": "..."}`，由 BFF 的 `writeError` 与各领域服务的同名函数产生。
        唯一例外：`GET /ready` 失败返回 `text/plain`。
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            机器可读错误码。下面是**当前代码中实际出现过的值全集**（按来源分组）：

            - BFF 自身：`METHOD_NOT_ALLOWED`、`FORBIDDEN`、`UPSTREAM_UNAVAILABLE`、
              `INVALID_BODY`、`REQUEST_FAILED`、`INVALID_PATH`、`INVALID_CHANNEL`。
            - production：`NOT_READY`、`INTENT_UNAVAILABLE`、`INVALID_IDEMPOTENCY_KEY`、
              `INVALID_BODY`、`INVALID_INTENT`、`IDEMPOTENCY_CONFLICT`、`PROJECT_NOT_FOUND`、
              `NOT_FOUND`、`PROJECT_UNAVAILABLE`、`UNAUTHENTICATED`、`INVALID_CONTEXT`、
              `INVALID_PROJECT`、`INVALID_INPUT`、`CATALOG_UNAVAILABLE`、`MODEL_NOT_FOUND`、
              `DUPLICATE_MODEL`、`INVALID_CHANNEL`、`INVALID_MODEL`、`PROBE_UNAVAILABLE`、
              `BAD_REQUEST`、`DUPLICATE`、`INTERNAL`、`BUILTIN_PROTECTED`、`TEMPLATE_IN_USE`、
              `LOGICAL_MODEL_NOT_FOUND`、`CANDIDATE_NOT_FOUND`、`MODEL_ALREADY_BOUND`、
              `DUPLICATE_LOGICAL_MODEL`、`ID_IMMUTABLE`、`INVALID_ID`、`INVALID_TYPE`、
              `INVALID_LABEL`、`INVALID_STATUS`、`LOGICAL_MODEL_UNAVAILABLE`。
              （`MODEL_NOT_FOUND` 既用于 catalog 模型，也用于逻辑模型候选绑定。）
            - execution：`NOT_READY`、`INVALID_CONTEXT`、`INVALID_BODY`、`INVALID_INTENT`、
              `INTENT_CONFLICT`、`EXECUTION_UNAVAILABLE`、`UNAUTHENTICATED`、`INVALID_JSON`、
              `IDEMPOTENCY_CONFLICT`、`INVALID_TASK`、`TASK_UNAVAILABLE`、`NOT_FOUND`、
              `INVALID_STATE`、`INVALID_RUN`、`CATALOG_UNAVAILABLE`、`MODEL_NOT_FOUND`、
              `MODEL_NO_PROTOCOL`、`TEMPLATE_NOT_FOUND`、`CREDENTIALS_MISSING`、
              `INVALID_GENERATE`、`MISSING_REFERENCE`、`MAPPING_ENGINE_ERROR`、`MISSING_PARAM`、
              `MAPPING_ERROR`、`JOB_CREATE_FAILED`、`AUDIT_UNAVAILABLE`、`AUDIT_QUERY_FAILED`。
            - asset：`NOT_READY`、`UNAUTHENTICATED`、`INVALID_CONTEXT`、`INVALID_JSON`、
              `INVALID_UPLOAD`、`UPLOAD_FAILED`、`NOT_FOUND`、`CONFLICT`、`PAYLOAD_TOO_LARGE`、
              `SIZE_MISMATCH`、`COMMIT_FAILED`、`HASH_MISMATCH`、`ASSET_UNAVAILABLE`。
            - workspace：`NOT_READY`、`UNAUTHENTICATED`、`INVALID_CONTEXT`、`FORBIDDEN`、
              `WORKSPACE_UNAVAILABLE`、`INVALID_BODY`、`CREDENTIAL_UNAVAILABLE`、`NOT_FOUND`、
              `CHANNEL_UNAVAILABLE`、`INVALID_CHANNEL`、`INVALID_KIND`、`INVALID_AUTH`、
              `INVALID_PROTOCOL`。
            - 前端本地兜底：`UNKNOWN_ERROR`（响应体无法解析为 `{code}` 时由
              `ApiError` 使用，不由服务端返回）。

            **前向兼容要求**：客户端必须容忍未知 code（按「未知错误」展示 `message`），
            不要把 `code` 当作闭集 switch。新增 code 不算破坏性变更；**删除或改名算**。
          enum:
            - METHOD_NOT_ALLOWED
            - FORBIDDEN
            - UPSTREAM_UNAVAILABLE
            - INVALID_BODY
            - REQUEST_FAILED
            - INVALID_PATH
            - INVALID_CHANNEL
            - NOT_READY
            - INTENT_UNAVAILABLE
            - INVALID_IDEMPOTENCY_KEY
            - INVALID_INTENT
            - IDEMPOTENCY_CONFLICT
            - PROJECT_NOT_FOUND
            - NOT_FOUND
            - PROJECT_UNAVAILABLE
            - UNAUTHENTICATED
            - INVALID_CONTEXT
            - INVALID_PROJECT
            - INVALID_INPUT
            - CATALOG_UNAVAILABLE
            - MODEL_NOT_FOUND
            - DUPLICATE_MODEL
            - INVALID_MODEL
            - PROBE_UNAVAILABLE
            - BAD_REQUEST
            - DUPLICATE
            - INTERNAL
            - BUILTIN_PROTECTED
            - TEMPLATE_IN_USE
            - LOGICAL_MODEL_NOT_FOUND
            - CANDIDATE_NOT_FOUND
            - MODEL_ALREADY_BOUND
            - DUPLICATE_LOGICAL_MODEL
            - ID_IMMUTABLE
            - INVALID_ID
            - INVALID_TYPE
            - INVALID_LABEL
            - INVALID_STATUS
            - LOGICAL_MODEL_UNAVAILABLE
            - INTENT_CONFLICT
            - EXECUTION_UNAVAILABLE
            - INVALID_JSON
            - INVALID_TASK
            - TASK_UNAVAILABLE
            - INVALID_STATE
            - INVALID_RUN
            - MODEL_NO_PROTOCOL
            - TEMPLATE_NOT_FOUND
            - CREDENTIALS_MISSING
            - INVALID_GENERATE
            - MISSING_REFERENCE
            - MAPPING_ENGINE_ERROR
            - MISSING_PARAM
            - MAPPING_ERROR
            - JOB_CREATE_FAILED
            - AUDIT_UNAVAILABLE
            - AUDIT_QUERY_FAILED
            - INVALID_UPLOAD
            - UPLOAD_FAILED
            - CONFLICT
            - PAYLOAD_TOO_LARGE
            - SIZE_MISMATCH
            - COMMIT_FAILED
            - HASH_MISMATCH
            - ASSET_UNAVAILABLE
            - WORKSPACE_UNAVAILABLE
            - CREDENTIAL_UNAVAILABLE
            - CHANNEL_UNAVAILABLE
            - INVALID_KIND
            - INVALID_AUTH
            - INVALID_PROTOCOL
        message:
          type: string
          description: 人类可读说明（中文或英文，直接来自服务端）。
      additionalProperties: true

    ProjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Project'}
      additionalProperties: false

    Project:
      type: object
      description: 漫剧项目；`required` 依据前端 `ServerProject` 的非可选字段。
      required:
        - id
        - title
        - style_id
        - style_version
        - aspect_ratio
        - default_image_model
        - default_video_model
        - status
        - current_source_version
        - source_version
        - created_at
        - updated_at
      properties:
        id: {type: string, description: 形如 `proj_` + 32 位十六进制。}
        title: {type: string}
        style_id: {type: string}
        style_version: {type: string}
        aspect_ratio:
          type: string
          enum: ['16:9', '9:16', '1:1']
        default_text_model:
          type: string
          description: 前端声明为可选（`?`）；服务端字段以服务端为准，契约待补。
        default_image_model: {type: string}
        default_video_model: {type: string}
        status:
          type: string
          description: 状态取值以服务端为准，契约待补（前端按不透明字符串处理）。
        current_source_version: {type: integer}
        source_version:
          type: object
          description: 当前源文本版本快照。
          required: [version, sha256, created_at]
          properties:
            version: {type: integer}
            sha256: {type: string}
            created_at: {type: string, format: date-time}
          additionalProperties: true
        source_text:
          type: string
          description: 仅详情接口（`GET /api/v1/comic-projects/{projectId}`）返回；列表不返回。
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
      additionalProperties: true

    CreateProjectRequest:
      type: object
      description: 创建项目的完整请求体（上游缺任一必填项即 `422 INVALID_PROJECT`）。
      required:
        - title
        - style_id
        - style_version
        - aspect_ratio
        - default_text_model
        - default_image_model
        - default_video_model
        - source_text
      properties:
        title: {type: string}
        style_id: {type: string}
        style_version: {type: string}
        aspect_ratio:
          type: string
          enum: ['16:9', '9:16', '1:1']
        default_text_model: {type: string}
        default_image_model: {type: string}
        default_video_model: {type: string}
        source_text: {type: string}
      additionalProperties: true

    ProjectPatch:
      type: object
      description: 前端发送 `Partial<CreateProjectRequest>`；字段可任意子集。
      properties:
        title: {type: string}
        style_id: {type: string}
        style_version: {type: string}
        aspect_ratio:
          type: string
          enum: ['16:9', '9:16', '1:1']
        default_text_model: {type: string}
        default_image_model: {type: string}
        default_video_model: {type: string}
        source_text: {type: string}
      additionalProperties: true

    EpisodeList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/Episode'}
      additionalProperties: false

    Episode:
      type: object
      description: |
        剧集。其中 `counts`、`interpretation`、`execution_target`、`stage_models`、
