openapi: 3.1.0
info:
  title: 漫剧导演工坊 BFF 对外契约（/api/v1/*）
  version: 0.1.0
  summary: web-bff 暴露给浏览器的 HTTP 契约（前端唯一入口）
  description: |
    # 范围

    本文件描述 **web-bff 对外契约**，即浏览器/前端可以调用的 `/api/v1/*`（外加 BFF 自身的
    `/live`、`/ready` 运维端点）。前端 `apps/web/src/lib/api/client.ts` 的所有方法都必须能在
    本文件中找到对应 operation。

    不在本文件范围内：

    - `/internal/v1/*`、`/v1/generate`：**服务间契约**（BFF → 领域服务），当前未覆盖，见
      `openapi/README.md`「后续任务」。
    - 静态资源、前端路由、`/runtime/*` 等第三方 CDN 前缀。

    # 结构来源（唯一事实源）

    契约按以下代码逐条核对，不做推测性补充：

    | 内容 | 来源 |
    |---|---|
    | 路由、方法、允许的方法集合、错误码、响应头 | `services/web-bff/cmd/server/main.go` |
    | 请求/响应字段（TS 类型） | `apps/web/src/lib/api/client.ts` |
    | 转发目标与上游响应结构 | `services/{workspace,production,execution,asset}/internal/httpapi/*.go` |
    | 端口与令牌变量 | `.env.example` |
    | 调用与鉴权叙述 | `docs/architecture/01-c4-context-container.md`、`docs/architecture/02-key-sequences.md` |

    # 鉴权现状（如实描述，不要假设已有 OIDC）

    - **浏览器 → BFF：当前没有任何鉴权。** 没有 OIDC、没有 JWT、没有会话 Cookie，浏览器也
      **不需要**发送任何身份头。BFF 使用服务端环境变量 `BFF_DEV_WORKSPACE_ID`（默认 `ws_dev`）
      与 `BFF_DEV_ACTOR_ID` 作为固定开发身份（见 `.env.example` 与 C4 文档「信任模型」）。
      因此本规范根级 `security: []`：这些 operation 不要求调用方提供凭据。
    - **BFF → 领域服务：静态内部令牌。** BFF 向每个领域服务注入
      `Authorization: Bearer <SERVICE>_INTERNAL_TOKEN`，并把 `X-Workspace-Id` / `X-Actor-Id`
      写为上述开发身份（`services/web-bff/cmd/server/main.go` 的 `projects`/`assets`/`tasks`/
      `generate`/`catalogProxy`/`ruleTemplates`/`logicalModels`/`workspaceCredentials`/
      `workspaceChannels`）。
      浏览器无法、也不应提供该令牌。
    - `components.securitySchemes` 中列出的两个 scheme 仅用于描述 **BFF → 领域服务** 这一跳，
      不是浏览器契约的一部分；不要据此在客户端实现鉴权。
    - 生产化必须补 OIDC + 短期凭证（或 mTLS），届时根级 `security` 与各 operation 需要同步更新，
      属**破坏性变更**（见 `openapi/README.md`）。

    # 统一约定

    - **响应包装**：没有全局 envelope。列表接口统一返回 `{ "items": [...] }`；错误统一返回
      `{"code": "...", "message": "..."}`（`components.schemas.Error`）。个别接口有专用包装，
      例如 `POST /api/v1/generate` 同步返回 `{ok, status, output, run}`、异步返回
      `{task_id, status, poll_url}`；`POST /api/v1/tasks/run` 返回 `{ok, run}`；
      `PUT /api/v1/workspace/credentials/{channelId}` 返回 `{channelId, stored}`；
      `PUT /api/v1/workspace/channels/{channelId}` 返回 `{channel, ...}`。
      **逻辑模型例外**：`/api/v1/logical-models*` 是纯透传，上游 production 返回**裸数组**
      （`LogicalModel[]` / `LogicalModelCandidate[]`），没有 `{items: [...]}` 包装。
    - **缓存**：BFF 对所有响应强制
      `Cache-Control: no-store, no-cache, must-revalidate, max-age=0` + `Pragma: no-cache`
      + `Expires: 0`（`withTimeout` 中间件），任务/生成/审计路径额外显式设置一次。前端轮询任务
      状态时总是拿到最新数据。
    - **幂等**：`POST /api/v1/comic-projects`、`POST /api/v1/generation-intents`、`POST /api/v1/tasks`
      若调用方未带 `Idempotency-Key`，BFF 会自动生成（`bff_<32hex>`）后转发；重放时上游返回
      `200` 而不是 `201`。
    - **请求体上限**（BFF 读取限制，超出即 `INVALID_BODY`）：comic-projects / tasks / generate
      `2MiB + 4096`；rule-templates `2MiB`；catalog / logical-models / workspace 凭据 /
      workspace 渠道 `256KiB + 4096`；generation-intents `512KiB + 4096`；渠道探测 `/probe`
      请求体 `16KiB`。
    - **超时**：BFF 请求上下文 300s（`withTimeout`），内部 HTTP client 300s，
      单个上游服务另有自己的超时（workspace 5s、asset 60s）。
    - **字段不确定处**：凡是仅由 TS 类型声明的深层结构（`Record<string, unknown>` 等），
      使用宽松 schema（`type: object` + `additionalProperties: true`）并在 description 注明
      「字段以服务端为准，契约待补」。**不编造字段。**

    # 已知不一致（待确认，见 openapi/README.md）

    - `GET /api/v1/generation-intents` 会被 BFF 前缀处理器接受，但 production 没有集合 GET 路由，
      实际返回 `405`（见该 path 的 description）。
    - 异步生成返回的 `poll_url` 目前是上游内部路径 `/internal/v1/tasks/{id}`，**未**被 BFF 重写为
      `/api/v1/tasks/{id}`；浏览器直接轮询该值会打到非 BFF 路径。
servers:
  - url: /
    description: |
      前端同源相对路径。开发期由 Vite dev server 代理 `/api` → `http://127.0.0.1:8080`
      （`BFF_PROXY_TARGET` 可覆盖，见 `apps/web/vite.config.ts`）；正式部署由网关/Nginx 同源转发。
      本地直接联调 BFF 也可用 `http://127.0.0.1:8080`（`BFF_LISTEN_ADDR` 默认 `0.0.0.0:8080`）。
security: []
tags:
  - name: 运维
    description: BFF 自身的存活/就绪探针，不属于 /api/v1 前端契约。
  - name: 漫剧项目
    description: 项目 CRUD。转发到 production `/internal/v1/comic-projects*`。
  - name: 剧集
    description: 剧集 CRUD。转发到 production `/internal/v1/comic-projects/{projectID}/episodes*`。
  - name: 单集资产
    description: 单集描述性资产（角色/道具/场景的 prompt 与版本历史）。转发到 production `.../assets*`。
  - name: 项目角色库
    description: 项目级角色库（全剧通用角色设定与标准立绘）。转发到 production `.../characters*`。
  - name: 生成意图
    description: 生成意图（提交后由 outbox/worker 派发）。转发到 production `/internal/v1/generation-intents*`。
  - name: 资产上传
    description: 二进制资产上传会话。转发到 asset `/internal/v1/assets*`。
  - name: 任务
    description: Job 查询与控制。转发到 execution `/internal/v1/tasks*`。
  - name: 模型网关
    description: 统一模型网关同步/异步生成。BFF 转发到 execution `/v1/generate`（注意不是 /internal/v1）。
  - name: 审计日志
    description: 网关审计日志查询。转发到 execution `/internal/v1/audit/logs`。
  - name: 渠道探测
    description: 渠道连通性探测，**由 BFF 在边缘自己实现**（编排 production 目录 + workspace 凭据 + 真实 HTTP 请求），不转发。
  - name: 模型目录
    description: 平台共享模型目录（渠道/模型/协议模板）CRUD。转发到 production `/internal/v1/catalog*`。
  - name: 规则模板
    description: 拆分/提示词规则模板 CRUD。转发到 production `/internal/v1/rule-templates*`。
  - name: 逻辑模型
    description: |
      逻辑模型（对外统一标识）与候选绑定 CRUD。转发到 production `/internal/v1/logical-models*`，
      路径一一对应；状态码与错误码原样透传（`400 ID_IMMUTABLE`、`409 MODEL_ALREADY_BOUND`、
      `404 MODEL_NOT_FOUND` / `CANDIDATE_NOT_FOUND`）。
  - name: 工作区凭据
    description: 租户渠道凭据（只写不读 key）。转发到 workspace `/internal/v1/workspaces/{workspace_id}/credentials*`。
  - name: 工作区渠道
    description: 租户自有渠道（非平台目录）。转发到 workspace `/internal/v1/workspaces/{workspace_id}/channels*`。

paths:
  /live:
    get:
      operationId: getLive
      tags: [运维]
      summary: 存活探针
      description: 直接返回 `204 No Content`，不访问任何依赖。
      security: []
      responses:
        '204':
          description: 进程存活
  /ready:
    get:
      operationId: getReady
      tags: [运维]
      summary: 就绪探针
      description: |
        依次对 workspace、production、asset、execution 的 `/ready` 发起带内部令牌的探测。
        任一失败返回 `503`，且响应体是 `text/plain` 错误描述（**不是** JSON `Error`）。
      security: []
      responses:
        '204':
          description: 四个领域服务均就绪
        '503':
          description: 至少一个领域服务不可用（响应体为 text/plain，如 `workspace unavailable`）
          content:
            text/plain:
              schema:
                type: string

  /api/v1/comic-projects:
    get:
      operationId: listComicProjects
      tags: [漫剧项目]
      summary: 列出当前工作区的漫剧项目
      description: BFF 以固定开发身份调用 production `GET /internal/v1/comic-projects`。
      x-upstream: {service: production, method: GET, path: '/internal/v1/comic-projects'}
      responses:
        '200':
          description: 项目列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectList'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}
    post:
      operationId: createComicProject
      tags: [漫剧项目]
      summary: 创建漫剧项目
      description: |
        转发到 production `POST /internal/v1/comic-projects`。BFF 对 POST 自动补
        `Idempotency-Key`（若调用方未提供）。上游幂等重放时返回 `200`，新建返回 `201`
        （`Location` 头被 BFF 透传）。请求体为 `title/style_id/style_version/aspect_ratio/
        default_text_model/default_image_model/default_video_model/source_text`（缺任一必填项
        上游返回 `422 INVALID_PROJECT`）。
      x-upstream: {service: production, method: POST, path: '/internal/v1/comic-projects'}
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateProjectRequest'}
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '200':
          description: 幂等重放，返回既有项目
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}

  /api/v1/comic-projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getComicProject
      tags: [漫剧项目]
      summary: 获取项目详情
      description: 详情响应包含 `source_text`（列表不返回）。
      x-upstream: {service: production, method: GET, path: '/internal/v1/comic-projects/{id}'}
      responses:
        '200':
          description: 项目详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '404': {$ref: '#/components/responses/NotFound'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}
    patch:
      operationId: updateComicProject
      tags: [漫剧项目]
      summary: 局部更新项目
      description: |
        前端发送 `Partial<CreateProjectRequest>`。BFF 对 PATCH 强制 `Content-Type: application/json`
        后转发；上游校验失败返回 `422 INVALID_INPUT`。
      x-upstream: {service: production, method: PATCH, path: '/internal/v1/comic-projects/{id}'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ProjectPatch'}
      responses:
        '200':
          description: 更新后的项目
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Project'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}
    delete:
      operationId: deleteComicProject
      tags: [漫剧项目]
      summary: 删除项目
      description: 成功返回 `204`（无响应体）。上游对 id 前缀/长度有校验，不匹配即 `404`。
      x-upstream: {service: production, method: DELETE, path: '/internal/v1/comic-projects/{id}'}
      responses:
        '204':
          description: 已删除
        '404': {$ref: '#/components/responses/NotFound'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}

  /api/v1/comic-projects/{projectId}/episodes:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listEpisodes
      tags: [剧集]
      summary: 列出项目下的剧集
      x-upstream: {service: production, method: GET, path: '/internal/v1/comic-projects/{projectID}/episodes'}
      responses:
        '200':
          description: 剧集列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EpisodeList'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}
    post:
      operationId: createEpisode
      tags: [剧集]
      summary: 新建剧集
      x-upstream: {service: production, method: POST, path: '/internal/v1/comic-projects/{projectID}/episodes'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateEpisodeRequest'}
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Episode'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}

  /api/v1/comic-projects/{projectId}/episodes/{episodeId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/EpisodeId'
    get:
      operationId: getEpisode
      tags: [剧集]
      summary: 获取剧集详情
      x-upstream: {service: production, method: GET, path: '/internal/v1/comic-projects/{projectID}/episodes/{episodeID}'}
      responses:
        '200':
          description: 剧集详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Episode'}
        '404': {$ref: '#/components/responses/NotFound'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}
    patch:
      operationId: updateEpisode
      tags: [剧集]
      summary: 局部更新剧集
      description: 前端发送 `Partial<ServerEpisode>`；字段集合很大（stage/directing/executable_units 等），以服务端为准。
      x-upstream: {service: production, method: PATCH, path: '/internal/v1/comic-projects/{projectID}/episodes/{episodeID}'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EpisodePatch'}
      responses:
        '200':
          description: 更新后的剧集
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Episode'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}
    delete:
      operationId: deleteEpisode
      tags: [剧集]
      summary: 删除剧集
      x-upstream: {service: production, method: DELETE, path: '/internal/v1/comic-projects/{projectID}/episodes/{episodeID}'}
      responses:
        '204':
          description: 已删除
        '404': {$ref: '#/components/responses/NotFound'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}

  /api/v1/comic-projects/{projectId}/episodes/{episodeId}/assets:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/EpisodeId'
    get:
      operationId: listEpisodeAssets
      tags: [单集资产]
      summary: 列出单集资产
      x-upstream: {service: production, method: GET, path: '/internal/v1/comic-projects/{projectID}/episodes/{episodeID}/assets'}
      responses:
        '200':
          description: 单集资产列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EpisodeAssetList'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}
    post:
      operationId: createEpisodeAsset
      tags: [单集资产]
      summary: 新建单集资产
      x-upstream: {service: production, method: POST, path: '/internal/v1/comic-projects/{projectID}/episodes/{episodeID}/assets'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateEpisodeAssetRequest'}
      responses:
        '201':
          description: 创建成功
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EpisodeAsset'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}

  /api/v1/comic-projects/{projectId}/episodes/{episodeId}/assets/{assetId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/EpisodeId'
      - $ref: '#/components/parameters/AssetId'
    get:
      operationId: getEpisodeAsset
      tags: [单集资产]
      summary: 获取单集资产详情
      x-upstream: {service: production, method: GET, path: '/internal/v1/comic-projects/{projectID}/episodes/{episodeID}/assets/{assetID}'}
      responses:
        '200':
          description: 单集资产详情
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EpisodeAsset'}
        '404': {$ref: '#/components/responses/NotFound'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}
    patch:
      operationId: updateEpisodeAsset
      tags: [单集资产]
      summary: 局部更新单集资产
      description: 前端发送 `Partial<ServerEpisodeAsset>`（含 `versions` / `episode_variant` / 变体立绘字段）。
      x-upstream: {service: production, method: PATCH, path: '/internal/v1/comic-projects/{projectID}/episodes/{episodeID}/assets/{assetID}'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/EpisodeAssetPatch'}
      responses:
        '200':
          description: 更新后的单集资产
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EpisodeAsset'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '404': {$ref: '#/components/responses/NotFound'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}
    delete:
      operationId: deleteEpisodeAsset
      tags: [单集资产]
      summary: 删除单集资产
      x-upstream: {service: production, method: DELETE, path: '/internal/v1/comic-projects/{projectID}/episodes/{episodeID}/assets/{assetID}'}
      responses:
        '204':
          description: 已删除
        '404': {$ref: '#/components/responses/NotFound'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}

  /api/v1/comic-projects/{projectId}/characters:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: listProjectCharacters
      tags: [项目角色库]
      summary: 列出项目级角色
      x-upstream: {service: production, method: GET, path: '/internal/v1/comic-projects/{projectID}/characters'}
      responses:
        '200':
          description: 角色列表
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProjectCharacterList'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '503': {$ref: '#/components/responses/UpstreamUnavailable'}
    post:
      operationId: createProjectCharacter
      tags: [项目角色库]
      summary: 新建项目级角色
      x-upstream: {service: production, method: POST, path: '/internal/v1/comic-projects/{projectID}/characters'}
      requestBody:
        required: true
        content:
