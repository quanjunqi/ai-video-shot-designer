        - name: since
          in: query
          schema: {type: string, format: date-time}
          description: 起始时间（RFC3339，含）。非法值返回 400 INVALID_SINCE。
        - name: until
          in: query
          schema: {type: string, format: date-time}
          description: 结束时间（RFC3339，含）。非法值返回 400 INVALID_UNTIL。
      responses:
